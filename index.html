  <style>
    /* ── Verônica Design System tokens ─────────────────────── */
    :root {
      --off-white: #FFFCF4;
      --black:     #0F0F0F;
      --pink:      #FF8FB8;
      --lime:      #D4FF3D;

      --black-80:  rgba(15,15,15,0.80);
      --black-60:  rgba(15,15,15,0.60);
      --black-40:  rgba(15,15,15,0.40);
      --black-12:  rgba(15,15,15,0.12);
      --off-92:    rgba(255,252,244,0.92);

      --bg:        var(--off-white);
      --fg:        var(--black);
      --fg-muted:  var(--black-60);
      --rule:      var(--black-12);
      --accent:    var(--pink);

      --font-display: 'Inter', system-ui, sans-serif;
      --font-italic:  'EB Garamond', Georgia, serif;
      --font-body:    'Inter', system-ui, sans-serif;

      --weight-black:   900;
      --weight-regular: 400;

      --t-h1:    clamp(42px, 7vw, 96px);
      --t-h2:    28px;
      --t-body:  16px;
      --t-sm:    14px;
      --t-xs:    12px;
      --t-cap:   11px;

      --lh-tight: 0.92;
      --lh-snug:  1.10;
      --lh-body:  1.50;

      --track-tight: -0.02em;
      --track-cap:    0.08em;

      --s-1:  4px;
      --s-2:  8px;
      --s-3: 12px;
      --s-4: 16px;
      --s-5: 24px;
      --s-6: 32px;

      --r-sm:   10px;
      --r-md:   16px;
      --r-lg:   22px;
      --r-pill: 999px;

      --shadow-1: 0 2px 6px  rgba(15,15,15,0.05);
      --shadow-2: 0 6px 20px rgba(15,15,15,0.08);

      --ease: cubic-bezier(0.32,0.72,0,1);
      --dur: 200ms;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      font-family:var(--font-body);
      background:var(--bg);
      color:var(--fg);
      font-size:var(--t-body);
      line-height:var(--lh-body);
      -webkit-font-smoothing:antialiased;
      min-height:100vh;
    }
    button{font-family:var(--font-body);cursor:pointer;border:none;background:none}
    input{font-family:var(--font-body);outline:none}
    ::-webkit-scrollbar{width:3px}
    ::-webkit-scrollbar-thumb{background:var(--black-12);border-radius:3px}

    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes chk{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}

    .fu{animation:fadeUp .22s var(--ease) both}
    .su{animation:slideUp .28s var(--ease) both}
    .chk{animation:chk .2s var(--ease) both}
    .spin{animation:spin .8s linear infinite}

    /* ── Card base ── */
    .card{
      background:var(--off-white);
      border:1.5px solid var(--black-12);
      border-radius:var(--r-lg);
      box-shadow:var(--shadow-2);
    }
    .card-black{background:var(--black);color:var(--off-white);border-color:var(--black)}
    .card-pink {background:var(--pink); color:var(--off-white);border-color:var(--pink)}
    .card-lime {background:var(--lime); color:var(--black);   border-color:var(--lime)}

    /* ── Capsule ── */
    .capsule{
      display:inline-flex;align-items:center;gap:var(--s-2);
      padding:5px 12px 6px;
      background:var(--black);color:var(--off-white);
      border-radius:var(--r-pill);
      font-family:var(--font-body);font-weight:700;
      font-size:var(--t-cap);letter-spacing:var(--track-cap);
      text-transform:uppercase;line-height:1;white-space:nowrap;
    }
    .capsule-pink{background:var(--pink);color:var(--black)}
    .capsule-lime{background:var(--lime);color:var(--black)}

    /* ── Primary button (preto, full-width) ── */
    .btn-primary{
      width:100%;padding:14px;
      font-family:var(--font-body);font-size:var(--t-sm);font-weight:900;
      letter-spacing:var(--track-cap);text-transform:uppercase;
      background:var(--black);color:var(--off-white);
      border-radius:var(--r-md);
      display:flex;align-items:center;justify-content:center;gap:8px;
      box-shadow:var(--shadow-2);
      transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease);
    }
    .btn-primary:disabled{background:var(--black-40);box-shadow:none;cursor:not-allowed}
    .btn-primary:not(:disabled):active{transform:scale(.97)}

    /* Variante lima */
    .btn-lime{background:var(--lime);color:var(--black)}
    .btn-lime:hover{background:#c5f024}

    /* ── Ghost button ── */
    .btn-ghost{
      width:100%;padding:13px;
      font-family:var(--font-body);font-size:var(--t-sm);font-weight:700;
      color:var(--fg);background:transparent;
      border:1.5px solid var(--black-40);border-radius:var(--r-md);
      display:flex;align-items:center;justify-content:center;gap:8px;
      transition:all var(--dur) var(--ease);
    }
    .btn-ghost:hover{border-color:var(--black);background:var(--black);color:var(--off-white)}

    /* ── Icon button ── */
    .btn-icon{
      width:40px;height:40px;border-radius:var(--r-sm);
      display:flex;align-items:center;justify-content:center;
      border:1.5px solid var(--black-12);background:var(--off-white);
      color:var(--black-60);font-size:15px;
      transition:all var(--dur) var(--ease);
    }
    .btn-icon:hover{border-color:var(--black);color:var(--fg)}
    .btn-icon.danger:hover{background:#FEF2F2;border-color:#FCA5A5;color:#DC2626}
    .btn-icon.active{background:var(--black);border-color:var(--black);color:var(--off-white)}

    /* ── Pill filter ── */
    .pill{
      padding:7px 14px;border-radius:var(--r-pill);font-size:var(--t-xs);font-weight:700;
      white-space:nowrap;border:1.5px solid var(--black-12);
      background:var(--off-white);color:var(--black-60);
      transition:all var(--dur) var(--ease);
    }
    .pill.active{background:var(--black);color:var(--off-white);border-color:var(--black)}

    /* ── Tab bar ── */
    .tab-bar{
      display:flex;background:var(--off-white);
      border-radius:var(--r-md);padding:4px;
      border:1.5px solid var(--black-12);box-shadow:var(--shadow-1);
    }
    .tab-btn{
      flex:1;padding:9px 4px;border-radius:var(--r-sm);
      font-weight:700;font-size:10px;letter-spacing:.03em;text-transform:uppercase;
      color:var(--black-60);transition:all var(--dur) var(--ease);
    }
    .tab-btn.active{background:var(--black);color:var(--off-white);box-shadow:var(--shadow-1)}

    /* ── Inputs ── */
    .input-field{
      width:100%;padding:13px 14px;font-size:var(--t-body);
      background:var(--off-white);border:1.5px solid var(--black-12);
      border-radius:var(--r-md);color:var(--fg);
      transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease);
    }
    .input-field:focus{
      border-color:var(--black);
      box-shadow:0 0 0 3px var(--black-12);
    }

    /* ── Muscle tag chip ── */
    .m-chip{
      display:inline-flex;align-items:center;
      padding:3px 9px;border-radius:var(--r-pill);
      font-size:var(--t-xs);font-weight:700;white-space:nowrap;
    }
  </style>
</head>

// ═══════════════════════════════════════════════════════════
// SUPABASE HELPERS
// ═══════════════════════════════════════════════════════════
const DB = {
  async plans(uid) {
    const {data} = await sb.from('plans').select('*,plan_exercises(*)').eq('user_id',uid).order('created_at')
    return (data||[]).map(p=>({
      id:p.id, _db:true, name:p.name,
      exercises:(p.plan_exercises||[])
        .sort((a,b)=>a.position-b.position)
        .map(e=>({exId:e.exercise_id,sets:e.sets,reps:isNaN(e.reps)?e.reps:+e.reps}))
    }))
  },
  async save(plan, uid) {
    let pid = plan._db ? plan.id : null
    if (!pid) {
      const {data} = await sb.from('plans').insert({name:plan.name,user_id:uid}).select().single()
      pid = data.id
    } else {
      await sb.from('plans').update({name:plan.name}).eq('id',pid)
      await sb.from('plan_exercises').delete().eq('plan_id',pid)
    }
    if (plan.exercises.length) {
      await sb.from('plan_exercises').insert(
        plan.exercises.map((e,i)=>({
          plan_id:pid, exercise_id:e.exId,
          exercise_name:EX.find(x=>x.id===e.exId)?.name||'',
          sets:e.sets, reps:String(e.reps), position:i
        }))
      )
    }
    return {...plan, id:pid, _db:true}
  },
  async del(id) { await sb.from('plans').delete().eq('id',id) },
  async startSession(uid, plan, kcal) {
    const {data} = await sb.from('workout_sessions').insert({
      user_id:uid, plan_id:plan._db?plan.id:null,
      plan_name:plan.name, exercises_total:plan.exercises.length, kcal_estimate:kcal
    }).select().single()
    return data?.id
  },
  async finishSession(sid, done, mins) {
    if (!sid) return
    await sb.from('workout_sessions').update({
      exercises_done:done, duration_minutes:mins, finished_at:new Date().toISOString()
    }).eq('id',sid)
  },
  async history(uid) {
    const {data} = await sb.from('workout_sessions').select('*').eq('user_id',uid).order('started_at',{ascending:false}).limit(20)
    return data||[]
  },
  async profile(uid) {
    const {data} = await sb.from('profiles').select('*').eq('id',uid).single()
    return data
  },
  async saveProfile(uid, u) {
    await sb.from('profiles').upsert({id:uid,...u,updated_at:new Date().toISOString()})
  },
}

// SVG STICK FIGURE ANIMATIONS
// ═══════════════════════════════════════════════════════════
const sk = c=>({stroke:c,strokeWidth:'2.5',strokeLinecap:'round',fill:'none'})
const AT = p=><animateTransform attributeName="transform" repeatCount="indefinite" {...p}/>
const SV = ({ch})=><svg viewBox="0 0 60 90" style={{width:'100%',height:'100%',overflow:'visible'}}>{ch}</svg>
const SW = ({ch})=><svg viewBox="0 0 88 56" style={{width:'100%',height:'100%',overflow:'visible'}}>{ch}</svg>

const H  = c=><circle cx="30" cy="9"  r="7" {...sk(c)}/>
const Bd = c=><line x1="30" y1="16" x2="30" y2="44" {...sk(c)}/>
const UL = c=><line x1="30" y1="24" x2="12" y2="37" {...sk(c)}/>
const UR = c=><line x1="30" y1="24" x2="48" y2="37" {...sk(c)}/>
const FL = c=><line x1="12" y1="37" x2="9"  y2="51" {...sk(c)}/>
const FR = c=><line x1="48" y1="37" x2="51" y2="51" {...sk(c)}/>
const TL = c=><line x1="24" y1="44" x2="21" y2="62" {...sk(c)}/>
const TR = c=><line x1="36" y1="44" x2="39" y2="62" {...sk(c)}/>
const SL = c=><line x1="21" y1="62" x2="17" y2="78" {...sk(c)}/>
const SR = c=><line x1="39" y1="62" x2="43" y2="78" {...sk(c)}/>
const Lg = c=><>{TL(c)}{SL(c)}{TR(c)}{SR(c)}</>
const Al = c=><>{H(c)}{Bd(c)}{UL(c)}{FL(c)}{UR(c)}{FR(c)}{Lg(c)}</>
const NF = c=><>{H(c)}{Bd(c)}{UL(c)}{UR(c)}{Lg(c)}</>
const NA = c=><>{H(c)}{Bd(c)}{Lg(c)}</>
const NL = c=><>{H(c)}{Bd(c)}{UL(c)}{FL(c)}{UR(c)}{FR(c)}{TR(c)}{SR(c)}</>

const ANIM = {
  squat:   c=><SV ch={<g><AT type="translate" values="0,0;0,13;0,0" dur="2s"/>{Al(c)}</g>}/>,
  lunge:   c=><SV ch={<g><AT type="translate" values="0,0;0,9;0,0"  dur="2s"/>{Al(c)}</g>}/>,
  calf:    c=><SV ch={<g><AT type="translate" values="0,0;0,-9;0,0" dur="1.5s"/>{Al(c)}</g>}/>,
  pullup:  c=><SV ch={<g><AT type="translate" values="0,0;0,-13;0,0" dur="2s"/>{Al(c)}</g>}/>,
  push:    c=><SV ch={<>{NF(c)}<g><AT type="rotate" values="0 12 37;65 12 37;0 12 37" dur="1.5s"/>{FL(c)}</g><g><AT type="rotate" values="0 48 37;-65 48 37;0 48 37" dur="1.5s"/>{FR(c)}</g></>}/>,
  pushv:   c=><SV ch={<>{NA(c)}<g><AT type="rotate" values="0 30 24;80 30 24;0 30 24" dur="1.5s"/>{UL(c)}{FL(c)}</g><g><AT type="rotate" values="0 30 24;-80 30 24;0 30 24" dur="1.5s"/>{UR(c)}{FR(c)}</g></>}/>,
  curl:    c=><SV ch={<>{NF(c)}<g><AT type="rotate" values="0 12 37;115 12 37;0 12 37" dur="1.5s"/>{FL(c)}</g><g><AT type="rotate" values="0 48 37;-115 48 37;0 48 37" dur="1.5s"/>{FR(c)}</g></>}/>,
  pullh:   c=><SV ch={<>{NF(c)}<g><AT type="rotate" values="0 12 37;85 12 37;0 12 37" dur="1.8s"/>{FL(c)}</g><g><AT type="rotate" values="0 48 37;-85 48 37;0 48 37" dur="1.8s"/>{FR(c)}</g></>}/>,
  lateral: c=><SV ch={<>{NA(c)}<g><AT type="rotate" values="0 30 24;45 30 24;0 30 24" dur="1.5s"/>{UL(c)}{FL(c)}</g><g><AT type="rotate" values="0 30 24;-45 30 24;0 30 24" dur="1.5s"/>{UR(c)}{FR(c)}</g></>}/>,
  hinge:   c=><SV ch={<><g><AT type="rotate" values="0 30 44;40 30 44;0 30 44" dur="2s"/>{H(c)}{Bd(c)}{UL(c)}{FL(c)}{UR(c)}{FR(c)}</g>{Lg(c)}</>}/>,
  crunch:  c=><SV ch={<><g><AT type="translate" values="0,0;3,9;0,0" dur="1.5s"/>{H(c)}<line x1="30" y1="16" x2="30" y2="34" {...sk(c)}/></g><line x1="30" y1="34" x2="30" y2="44" {...sk(c)}/>{UL(c)}{FL(c)}{UR(c)}{FR(c)}{Lg(c)}</>}/>,
  plank:   c=><SW ch={<g {...sk(c)}><AT type="translate" values="0,0;0,-3;0,0" dur="3s"/><circle cx="76" cy="20" r="6"/><line x1="70" y1="20" x2="14" y2="20"/><line x1="56" y1="20" x2="53" y2="34"/><line x1="53" y1="34" x2="42" y2="34"/><line x1="36" y1="20" x2="33" y2="34"/><line x1="33" y1="34" x2="22" y2="34"/><line x1="14" y1="20" x2="5" y2="20"/></g>}/>,
  rotation:c=><SV ch={<><g><AT type="rotate" values="0 30 44;-22 30 44;22 30 44;-22 30 44;0 30 44" dur="2.5s"/>{H(c)}{Bd(c)}{UL(c)}{FL(c)}{UR(c)}{FR(c)}</g>{Lg(c)}</>}/>,
  legraise:c=><SV ch={<>{NL(c)}<g><AT type="rotate" values="0 24 44;125 24 44;0 24 44" dur="2s"/>{TL(c)}{SL(c)}</g></>}/>,
}
const ExAnim = ({ak,c})=>{ const A=ANIM[ak]||ANIM.push; return A(c) }

        <div style={{display:'flex',gap:6,marginBottom:10,flexWrap:'wrap'}}>
          {[[`${plan.exercises.length} ex.`],[`${totalSets} séries`]].map(([v])=>(
            <span key={v} className="capsule" style={{fontSize:10}}>{v}</span>
          ))}
          {muscles.map(k=><MChip key={k} mKey={k} small/>)}

              display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'var(--fg-muted)'}}>

        <button className="btn-primary" onClick={onPlay}>
          ▶ Iniciar treino
        </button>
      </div>
    </div>
  )
}

// ═══════════════════════════════════════════════════════════
// WORKOUT PLAYER  — fix persistência + add-mid-workout
// ═══════════════════════════════════════════════════════════
function WorkoutPlayer({plan, user, onClose}) {
  // ⚠️ FIX PERSISTÊNCIA: congelamos uma cópia do plano no momento do início.
  // Assim, mesmo que o usuário edite o plano durante o treino, os exercícios
  // da sessão ativa não são afetados.
  const [items, setItems] = useState(()=>
    plan.exercises
      .map(e=>({...e, ex:EX.find(x=>x.id===e.exId)}))
      .filter(e=>e.ex)
      .map((e,i)=>({...e, key:`orig-${i}`}))
  )
  const [done,setDone]     = useState(new Set())
  const [fin,setFin]       = useState(false)
  const [addSheet,setAddSheet] = useState(false)
  const startRef = useRef(Date.now())
  const sidRef   = useRef(null)

  useEffect(()=>{
    DB.startSession(user.id, plan, 0).then(id=>sidRef.current=id).catch(()=>{})
  },[])

  const toggle = key => setDone(p=>{
    const s=new Set(p); s.has(key)?s.delete(key):s.add(key); return s
  })

  // Adiciona exercício ao vivo (não persiste no plano)
  const addLive = (ex) => {
    const defaultCfg = { sets: ex.ds, reps: ex.dr }
    const key = `live-${Date.now()}`
    setItems(prev=>[...prev, {exId:ex.id, ex, key, ...defaultCfg, isLive:true}])
  }

  const finish = async ()=>{
    const mins = Math.round((Date.now()-startRef.current)/60000)
    await DB.finishSession(sidRef.current, done.size, mins).catch(()=>{})
    setFin(true)
  }

  const pct = items.length ? (done.size/items.length)*100 : 0

  if(fin) return (
    <div className="su" style={{position:'fixed',inset:0,background:'var(--black)',zIndex:400,
      display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
      gap:24,padding:32,textAlign:'center'}}>
      <div style={{width:80,height:80,borderRadius:'var(--r-lg)',background:'var(--lime)',
        display:'flex',alignItems:'center',justifyContent:'center',fontSize:36}}>🏆</div>
      <div>
        <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:36,
          letterSpacing:'var(--track-tight)',color:'var(--off-white)',lineHeight:.95}}>
          TREINO<br/>CONCLUÍDO
        </div>
        <div style={{fontFamily:'var(--font-italic)',fontStyle:'italic',
          fontSize:16,color:'rgba(255,252,244,0.55)',marginTop:10}}>
          {done.size} de {items.length} exercícios
        </div>
      </div>
      <button className="btn-primary btn-lime" style={{maxWidth:280,fontSize:13}} onClick={onClose}>
        → Voltar aos treinos
      </button>
    </div>
  )

  return (
    <div className="su" style={{position:'fixed',inset:0,background:'var(--bg)',zIndex:400,
      display:'flex',flexDirection:'column',overflow:'hidden'}}>

      {/* ── header ── */}
      <div style={{background:'var(--black)',flexShrink:0}}>
        <div style={{padding:'14px 16px',display:'flex',alignItems:'center',gap:12}}>
          <button className="btn-icon active" onClick={onClose} style={{fontSize:14}}>✕</button>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:16,
              letterSpacing:'var(--track-tight)',color:'var(--off-white)',
              overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{plan.name}</div>
            <div style={{fontSize:12,color:'rgba(255,252,244,0.50)',fontWeight:600,marginTop:1}}>
              {done.size}/{items.length} concluídos
            </div>
          </div>
          {/* progress ring */}
          <div style={{position:'relative',width:40,height:40,flexShrink:0}}>
            <svg width={40} height={40} viewBox="0 0 40 40">
              <circle cx={20} cy={20} r={16} fill="none" stroke="rgba(255,252,244,0.12)" strokeWidth={4}/>
              <circle cx={20} cy={20} r={16} fill="none" stroke="var(--lime)" strokeWidth={4}
                strokeDasharray={2*Math.PI*16}
                strokeDashoffset={2*Math.PI*16*(1-pct/100)}
                strokeLinecap="round" transform="rotate(-90 20 20)"
                style={{transition:'stroke-dashoffset .4s var(--ease)'}}/>
            </svg>
            <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',
              fontSize:9,fontWeight:900,color:'var(--off-white)'}}>{Math.round(pct)}%</div>
          </div>
        </div>
        {/* progress bar */}
        <div style={{height:2,background:'rgba(255,252,244,0.08)'}}>
          <div style={{height:'100%',background:'var(--lime)',width:`${pct}%`,transition:'width .4s var(--ease)'}}/>
        </div>
        {/* tip */}
        <div style={{padding:'8px 16px',background:'rgba(212,255,61,0.10)',
          fontSize:12,color:'rgba(212,255,61,0.85)',fontWeight:600,display:'flex',gap:6,alignItems:'center'}}>
          <span>→</span> Toque em "Feito" em qualquer ordem — pule e volte quando quiser
        </div>
      </div>

      {/* ── exercise list ── */}
      <div style={{flex:1,overflowY:'auto',padding:'12px 16px',display:'flex',flexDirection:'column',gap:8}}>
        {items.map((e,i)=>{
          const isDone = done.has(e.key)
          const m = M[e.ex.m]
          const animC = m.bg==='#0F0F0F' ? '#FFFCF4' : m.c
          return (
            <div key={e.key} style={{
              background: isDone ? 'var(--black)' : 'var(--off-white)',
              borderRadius:'var(--r-lg)',overflow:'hidden',
              border:`1.5px solid ${isDone?'var(--black)':'var(--black-12)'}`,
              boxShadow: isDone ? 'none' : 'var(--shadow-1)',
              transition:'all .2s var(--ease)',
            }}>
              <div style={{padding:'12px 14px',display:'flex',alignItems:'center',gap:12}}>
                {/* num */}
                <div style={{
                  width:20,height:20,borderRadius:10,flexShrink:0,
                  display:'flex',alignItems:'center',justifyContent:'center',
                  background: isDone ? 'var(--lime)' : 'var(--black-12)',
                  fontSize:9,fontWeight:900,
                  color: isDone ? 'var(--black)' : 'var(--fg-muted)',
                }}>{i+1}</div>
                {/* anim */}
                <div style={{width:46,height:46,flexShrink:0,background:m.bg,
                  borderRadius:'var(--r-sm)',padding:4,
                  opacity:isDone?.5:1,transition:'opacity .2s'}}>
                  <ExAnim ak={e.ex.a} c={animC}/>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13,
                    color:isDone?'rgba(255,252,244,0.45)':'var(--fg)',
                    textDecoration:isDone?'line-through':'none',
                    overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:3}}>
                    {e.ex.name}
                    {e.isLive && <span style={{marginLeft:6,fontSize:10,
                      background:'var(--lime)',color:'var(--black)',
                      padding:'1px 5px',borderRadius:999,fontWeight:700}}>+</span>}
                  </div>
                  <div style={{display:'flex',gap:6,alignItems:'center'}}>
                    <span style={{fontSize:13,fontWeight:900,
                      color:isDone?'rgba(255,252,244,0.35)':'var(--fg)'}}>
                      {e.sets}×{e.reps}{typeof e.reps==='number'?' reps':''}
                    </span>
                    <MChip mKey={e.ex.m} small/>
                  </div>
                </div>
                <button onClick={()=>toggle(e.key)} style={{
                  flexShrink:0,padding:'8px 12px',borderRadius:'var(--r-sm)',

                  display:'flex',alignItems:'center',gap:5,whiteSpace:'nowrap',
                  transition:'all .2s var(--ease)',
                }}>
                  {isDone ? <><span className="chk">✓</span>Feito</> : <>○ Concluir</>}
                </button>
              </div>
            </div>
          )
        })}

        {/* ── botão adicionar exercício (Etapa 3) ── */}
        <button onClick={()=>setAddSheet(true)} style={{
          marginTop:4,width:'100%',padding:'12px',
          border:'1.5px dashed var(--black-40)',borderRadius:'var(--r-lg)',
          background:'transparent',color:'var(--black-60)',
          display:'flex',alignItems:'center',justifyContent:'center',gap:8,
          fontSize:13,fontWeight:700,
          transition:'all var(--dur) var(--ease)',
        }}
          onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--black)';e.currentTarget.style.color='var(--fg)'}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--black-40)';e.currentTarget.style.color='var(--black-60)'}}>
          <span style={{fontSize:18,lineHeight:1}}>+</span> Adicionar exercício
        </button>

        <div style={{height:8}}/>
      </div>

      {/* ── finish bar ── */}
      {done.size > 0 && (
        <div style={{padding:'12px 16px 18px',background:'var(--black)',
          borderTop:'1.5px solid rgba(255,252,244,0.08)',flexShrink:0}}>
          <button className="btn-primary btn-lime" style={{fontSize:13}} onClick={finish}>
            {done.size===items.length
              ? '🏆 Finalizar treino'
              : `→ Encerrar (${done.size}/${items.length})`}
          </button>
        </div>
      )}

      {/* add sheet */}
      {addSheet && (
        <AddExSheet
          onAdd={addLive}
          onClose={()=>setAddSheet(false)}
          existingIds={items.map(i=>i.exId)}
        />
      )}
    </div>
  )
}

// ═══════════════════════════════════════════════════════════
// PLAN MODAL
// ═══════════════════════════════════════════════════════════
function PlanModal({onSave, onClose, editing}) {
  const [step,setStep]=useState(1)
  const [name,setName]=useState(editing?.name||'')
  const [sel,setSel]=useState(editing?.exercises.map(e=>e.exId)||[])
  const [cfgs,setCfgs]=useState(()=>
    editing ? Object.fromEntries(editing.exercises.map(e=>[e.exId,{sets:e.sets,reps:e.reps}])) : {}
  )
  const [mf,setMf]=useState(null)

  const toggle = id=>{
    setSel(p=>{
      if(p.includes(id)) return p.filter(x=>x!==id)
      const ex=EX.find(x=>x.id===id)
      setCfgs(c=>({...c,[id]:{sets:ex.ds,reps:ex.dr}}))
      return [...p,id]
    })
  }
  const move = (i,d)=>{
    setSel(p=>{const a=[...p],n=i+d;if(n<0||n>=a.length)return a;[a[i],a[n]]=[a[n],a[i]];return a})
  }
  const upd = (id,f,v)=>setCfgs(c=>({...c,[id]:{...(c[id]||{sets:3,reps:12}),[f]:Math.max(1,v)}}))
  const canGo = name.trim() && sel.length>0
  const fex = mf ? EX.filter(e=>e.m===mf) : EX

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(15,15,15,.65)',zIndex:300,
      display:'flex',flexDirection:'column',justifyContent:'flex-end'}}
      onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="su" style={{background:'var(--off-white)',borderRadius:'var(--r-lg) var(--r-lg) 0 0',
        maxHeight:'94vh',display:'flex',flexDirection:'column',overflow:'hidden',
        boxShadow:'0 -8px 40px rgba(15,15,15,.2)'}}>

        {/* header */}
        <div style={{padding:'18px 18px 14px',borderBottom:'1.5px solid var(--black-12)',flexShrink:0}}>
          {/* stepper */}
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
            {[1,2].map(n=>(
              <React.Fragment key={n}>
                <div style={{width:24,height:24,borderRadius:12,
                  display:'flex',alignItems:'center',justifyContent:'center',
                  fontSize:11,fontWeight:900,
                  background:step>=n?'var(--black)':'var(--black-12)',
                  color:step>=n?'var(--off-white)':'var(--fg-muted)'}}>
                  {step>n?'✓':n}
                </div>
                <span style={{fontSize:12,fontWeight:700,letterSpacing:'.04em',textTransform:'uppercase',
                  color:step===n?'var(--fg)':'var(--fg-muted)'}}>
                  {n===1?'Exercícios':'Séries & ordem'}
                </span>
                {n<2&&<div style={{flex:1,height:1.5,borderRadius:1,
                  background:step>1?'var(--black)':'var(--black-12)'}}/>}
              </React.Fragment>
            ))}
            <button className="btn-icon" onClick={onClose} style={{fontSize:13,marginLeft:8}}>✕</button>
          </div>
          <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:22,
            letterSpacing:'var(--track-tight)'}}>
            {editing?'Editar treino':step===1?'Novo treino':'Configurar'}
          </div>
          <div style={{fontFamily:'var(--font-italic)',fontStyle:'italic',fontSize:13,
            color:'var(--fg-muted)',marginTop:3}}>
            {step===1
              ? `${sel.length} selecionado${sel.length!==1?'s':''} — toque para adicionar`
              : 'Ajuste séries, reps e reordene com ↑↓'}
          </div>
        </div>

        {/* body */}
        <div style={{flex:1,overflowY:'auto',padding:'16px 18px'}}>
          {step===1 && <>
            <div style={{marginBottom:16}}>
              <label style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',
                color:'var(--fg-muted)',display:'block',marginBottom:8}}>Nome do treino *</label>
              <input className="input-field" value={name}
                onChange={e=>setName(e.target.value)}
                placeholder="Ex: Treino A — Pernas"/>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <label style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',
                color:'var(--fg-muted)'}}>Exercícios *</label>
              {sel.length>0&&<span className="capsule capsule-lime">{sel.length} sel.</span>}
            </div>
            <div style={{display:'flex',gap:6,marginBottom:12,overflowX:'auto',paddingBottom:4}}>
              <button className={`pill ${mf===null?'active':''}`} onClick={()=>setMf(null)}>Todos</button>
              {Object.entries(M).map(([k,v])=>(
                <button key={k} className={`pill ${mf===k?'active':''}`}
                  onClick={()=>setMf(mf===k?null:k)}>{v.l}</button>
              ))}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:7}}>
              {fex.map((ex,i)=>(
                <ExRow key={ex.id} ex={ex} compact sel={sel.includes(ex.id)}
                  onClick={()=>toggle(ex.id)} delay={i*.015}/>
              ))}
            </div>
          </>}

          {step===2 && <>
            <div style={{padding:'10px 12px',background:'rgba(212,255,61,0.12)',
              border:'1px solid rgba(212,255,61,0.3)',borderRadius:'var(--r-sm)',
              marginBottom:14,fontSize:13,color:'var(--fg)',fontWeight:600}}>
              → Use ↑↓ para definir a ordem dos exercícios
            </div>
            {sel.map((id,idx)=>{
              const ex=EX.find(x=>x.id===id), cfg=cfgs[id]||{sets:3,reps:12}
              const m=M[ex.m], animC=m.bg==='#0F0F0F'?'#FFFCF4':m.c
              return (
                <div key={id} className="card" style={{padding:'14px',marginBottom:9}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                    {/* reorder */}
                    <div style={{display:'flex',flexDirection:'column',gap:3}}>
                      {[[-1,'↑'],[1,'↓']].map(([d,ic])=>{
                        const dis=d===-1?idx===0:idx===sel.length-1
                        return (
                          <button key={d} onClick={()=>move(idx,d)} disabled={dis}
                            style={{width:22,height:22,borderRadius:'var(--r-sm)',fontSize:11,fontWeight:700,
                              background:dis?'transparent':'var(--black-12)',
                              color:dis?'var(--black-12)':'var(--fg-muted)',
                              border:`1.5px solid ${dis?'transparent':'var(--black-12)'}`,
                              display:'flex',alignItems:'center',justifyContent:'center',
                              cursor:dis?'default':'pointer'}}>{ic}</button>
                        )
                      })}
                    </div>
                    {/* num badge */}
                    <div style={{width:22,height:22,borderRadius:11,background:'var(--black)',
                      display:'flex',alignItems:'center',justifyContent:'center',
                      fontSize:10,color:'var(--off-white)',fontWeight:900,flexShrink:0}}>{idx+1}</div>
                    {/* anim */}
                    <div style={{width:36,height:36,background:m.bg,borderRadius:'var(--r-sm)',padding:3,flexShrink:0}}>
                      <ExAnim ak={ex.a} c={animC}/>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:13,
                        overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ex.name}</div>
                      <MChip mKey={ex.m} small/>
                    </div>
                    <button className="btn-icon danger" onClick={()=>setSel(p=>p.filter(x=>x!==id))}
                      style={{fontSize:12}}>✕</button>
                  </div>
                  {/* sets/reps */}
                  <div style={{display:'flex',gap:10}}>
                    {[['sets','Séries'],['reps','Reps']].map(([f,lbl])=>(
                      <div key={f} style={{flex:1,background:'var(--black-12)',
                        borderRadius:'var(--r-md)',padding:'10px 12px'}}>
                        <div style={{fontSize:10,fontWeight:700,letterSpacing:'.08em',
                          textTransform:'uppercase',color:'var(--fg-muted)',marginBottom:8}}>{lbl}</div>
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                          {[[(cfg[f]||1)-1,'−'],[(cfg[f]||0)+1,'+']].map(([v,ic],bi)=>(
                            <button key={bi} onClick={()=>upd(id,f,v)}
                              style={{width:32,height:32,borderRadius:'var(--r-sm)',
                                background:'var(--off-white)',border:'1.5px solid var(--black-12)',
                                color:'var(--fg)',fontSize:18,fontWeight:700,
                                display:'flex',alignItems:'center',justifyContent:'center',
                                transition:'all var(--dur) var(--ease)'}}
                              onMouseEnter={e=>{e.currentTarget.style.background='var(--black)';e.currentTarget.style.color='var(--off-white)'}}
                              onMouseLeave={e=>{e.currentTarget.style.background='var(--off-white)';e.currentTarget.style.color='var(--fg)'}}>{ic}</button>
                          ))}
                          <span style={{fontSize:22,fontWeight:900,minWidth:28,textAlign:'center'}}>{cfg[f]||0}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )
            })}
          </>}
        </div>

        {/* footer */}
        <div style={{padding:'12px 18px 18px',borderTop:'1.5px solid var(--black-12)',
          display:'flex',gap:8,flexShrink:0}}>
          {step===2 && (
            <button className="btn-ghost" style={{flex:'none',width:'auto',padding:'12px 16px',fontSize:13}}
              onClick={()=>setStep(1)}>← Voltar</button>
          )}
          <button className="btn-primary" disabled={!canGo} onClick={
            step===1 ? ()=>{if(canGo)setStep(2)} : ()=>{
              if(!name.trim()||!sel.length) return
              onSave({
                name:name.trim(), _db:editing?._db, id:editing?.id,
                exercises:sel.map(id=>({exId:id,...(cfgs[id]||{sets:3,reps:12})}))
              })
            }
          } style={{fontSize:12}}>
            {step===1
              ? (canGo ? `Próximo: ${sel.length} exercício${sel.length!==1?'s':''} →` : 'Selecione exercícios')
              : (editing ? 'Salvar alterações' : '✓ Criar treino')}
          </button>
        </div>
      </div>
    </div>
  )
}

// HISTORY
// ═══════════════════════════════════════════════════════════
function History({uid}) {
  const [hist,setHist]=useState(null)
  useEffect(()=>{DB.history(uid).then(setHist).catch(()=>setHist([]))},[uid])

  if(!hist) return <div style={{display:'flex',justifyContent:'center',padding:'48px 0'}}><Spinner sz={32}/></div>
  if(!hist.length) return (
    <div style={{textAlign:'center',padding:'44px 20px',background:'var(--off-white)',
      borderRadius:'var(--r-lg)',border:'2px dashed var(--black-12)'}}>
      <div style={{fontSize:48,marginBottom:12}}>—</div>
      <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:17,marginBottom:6}}>Sem histórico ainda</div>
      <div style={{fontFamily:'var(--font-italic)',fontStyle:'italic',fontSize:14,color:'var(--fg-muted)'}}>
        Complete um treino para ver aqui
      </div>
    </div>
  )

  const fmt=iso=>{
    if(!iso) return '—'
    const d=new Date(iso)
    return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})+' · '+
           d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})
  }

  return (
    <div style={{display:'flex',flexDirection:'column',gap:9}}>
      {hist.map((s,i)=>(
        <div key={s.id} className="card fu" style={{padding:'16px 18px',animationDelay:`${i*.04}s`}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
            <div>
              <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:16,
                letterSpacing:'var(--track-tight)',marginBottom:3}}>{s.plan_name}</div>
              <div style={{fontFamily:'var(--font-italic)',fontStyle:'italic',
                fontSize:13,color:'var(--fg-muted)'}}>{fmt(s.started_at)}</div>
            </div>
            <span className={`capsule ${s.finished_at?'capsule-lime':''}`} style={{fontSize:10}}>
              {s.finished_at ? '✓ Concluído' : 'Em andamento'}
            </span>
          </div>
          <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {[
              [`${s.exercises_done||0}/${s.exercises_total} ex.`],
              s.duration_minutes && [`${s.duration_minutes} min`],
            ].filter(Boolean).map(([v])=>(
              <span key={v} className="capsule" style={{fontSize:10}}>{v}</span>
            ))}
          </div>
        </div>
      ))}
    </div>
  )
}

// ═══════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════
function MainApp({user}) {
  const [plans,setPlans]=useState(DEFAULT_PLANS)
  const [loading,setLoading]=useState(true)
  const [savingId,setSavingId]=useState(null)
  const [tab,setTab]=useState('plans')
  const [workout,setWorkout]=useState(null)
  const [modal,setModal]=useState(false)
  const [editing,setEditing]=useState(null)
  const [mf,setMf]=useState(null)
  const [showCfg,setShowCfg]=useState(false)
  const [weight,setWeight]=useState(70)
  const [goal,setGoal]=useState('hipertrofia')

  useEffect(()=>{
    (async ()=>{
      try {
        const [pl, prof] = await Promise.all([DB.plans(user.id), DB.profile(user.id)])
        let finalPlans = pl

        if (pl.length === 0) {
          const seeded = []
          for (const def of DEFAULT_PLANS) {
            try {
              const saved = await DB.save({...def,_db:false,id:null}, user.id)
              seeded.push(saved)
            } catch(e) { console.warn('Falha ao semear', def.name, e) }
          }
          finalPlans = seeded.length ? seeded : DEFAULT_PLANS
        } else {
          const recoveryKey = `gt_recovered_defaults_v1_${user.id}`
          if (!localStorage.getItem(recoveryKey)) {
            const existingNames = new Set(pl.map(p=>p.name))
            const restored = [...pl]
            for (const def of DEFAULT_PLANS) {
              if (!existingNames.has(def.name)) {
                try {
                  const saved = await DB.save({...def,_db:false,id:null}, user.id)
                  restored.push(saved)
                } catch(e) { console.warn('Falha ao restaurar', def.name, e) }
              }
            }
            finalPlans = restored
            localStorage.setItem(recoveryKey, new Date().toISOString())
          }
        }

        setPlans(finalPlans)
        if (prof?.weight_kg) setWeight(prof.weight_kg)
        if (prof?.goal) setGoal(prof.goal)
      } catch(e) {
        console.error('Erro ao carregar:', e)
      } finally {
        setLoading(false)
      }
    })()
  },[user.id])

  const saveProfile = useCallback((u)=>DB.saveProfile(user.id,u).catch(()=>{}),[user.id])

  const savePlan = async plan=>{
    setModal(false); setEditing(null)
    const tempKey = plan.id || `tmp_${Date.now()}`
    setSavingId(tempKey)
    try {
      const saved = await DB.save(plan, user.id)
      setPlans(p=>p.find(x=>x.id===saved.id) ? p.map(x=>x.id===saved.id?saved:x) : [...p,saved])
    } catch(e) { alert('Erro ao salvar: '+e.message) }
    finally { setSavingId(null) }
  }

  const delPlan = async plan=>{
    if (!confirm(`Excluir "${plan.name}"?`)) return
    setPlans(p=>p.filter(x=>x.id!==plan.id))
    if (plan._db) DB.del(plan.id).catch(()=>{})
  }

  // ⚠️ FIX PERSISTÊNCIA: ao iniciar o treino, passamos uma cópia profunda congelada
  // do plano para o WorkoutPlayer. Assim qualquer edição posterior ao plano
  // não afeta a sessão ativa.
  const startWorkout = (plan) => {
    setWorkout(JSON.parse(JSON.stringify(plan)))
  }

  const flib = mf ? EX.filter(e=>e.m===mf) : EX
  const GOALS = [
    ['hipertrofia','Hipertrofia'],['forca','Força'],
    ['emagrecimento','Emagrecimento'],['resistencia','Resistência'],
  ]

  if(loading) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:14}}>
      <Spinner sz={36}/><div style={{fontSize:13,color:'var(--fg-muted)',fontWeight:600}}>Carregando treinos…</div>
    </div>
  )

  return (
    <div style={{maxWidth:540,margin:'0 auto',minHeight:'100vh',background:'var(--bg)'}}>

      {/* ── App header ── */}
      <div style={{padding:'20px 18px 0',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div>
          <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:28,
            letterSpacing:'var(--track-tight)',lineHeight:.95,color:'var(--black)'}}>
            GYM<br/>TRACKER
          </div>
          <div style={{fontFamily:'var(--font-italic)',fontStyle:'italic',
            fontSize:12,color:'var(--fg-muted)',marginTop:4}}>{user.email}</div>
        </div>
        <button className={`btn-icon ${showCfg?'active':''}`}
          onClick={()=>setShowCfg(s=>!s)} title="Configurações" style={{fontSize:16}}>⚙</button>
      </div>

      {/* ── Settings panel ── */}
      {showCfg && (
        <div className="card fu" style={{margin:'12px 18px 0',padding:'16px 18px'}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',
            color:'var(--fg-muted)',marginBottom:14}}>Configurações</div>

          {/* peso */}
          <div style={{marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>Peso</div>
            <div style={{display:'flex',alignItems:'center',gap:14}}>
              {[-5,5].map((d,bi)=>(
                <button key={d} className="btn-icon"
                  onClick={()=>{const nw=Math.max(30,Math.min(200,weight+d));setWeight(nw);saveProfile({weight_kg:nw})}}>
                  {bi===0?'−':'+'}
                </button>
              )).reduce((acc,el,i)=>i===0?[el,
                <span key="w" style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:28,
                  minWidth:60,textAlign:'center',letterSpacing:'var(--track-tight)'}}>
                  {weight}<span style={{fontSize:14,fontWeight:400,color:'var(--fg-muted)'}}>kg</span>
                </span>,acc[0]]:[...acc,el],[])}
            </div>
          </div>

          {/* objetivo */}
          <div style={{marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>Objetivo</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              {GOALS.map(([k,l])=>(
                <button key={k} className={`pill ${goal===k?'active':''}`}
                  onClick={()=>{setGoal(k);saveProfile({goal:k})}}>{l}</button>
              ))}
            </div>
          </div>

          <button className="btn-ghost" style={{fontSize:12,color:'#DC2626',borderColor:'#FCA5A5'}}
            onClick={()=>sb.auth.signOut()}
            onMouseEnter={e=>{e.currentTarget.style.background='#FEF2F2';e.currentTarget.style.color='#DC2626'}}
            onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.color='#DC2626'}}>
            Sair da conta
          </button>
        </div>
      )}

      {/* ── Tab bar ── */}
      <div style={{margin:'14px 18px 0'}} className="tab-bar">
        {[['plans','Treinos'],['library','Exercícios'],['history','Histórico']].map(([t,l])=>(
          <button key={t} className={`tab-btn${tab===t?' active':''}`} onClick={()=>setTab(t)}>{l}</button>
        ))}
      </div>

      {/* ── Content ── */}
      <div style={{padding:'16px 18px 96px'}}>

        {/* PLANS */}
        {tab==='plans' && <>
          <div style={{marginBottom:16}}>
            <button className="btn-primary" onClick={()=>{setEditing(null);setModal(true)}}
              style={{fontSize:12}}>
              + Criar novo treino
            </button>
          </div>
          {plans.length===0 && (
            <div style={{textAlign:'center',padding:'44px 16px',
              background:'var(--off-white)',borderRadius:'var(--r-lg)',
              border:'2px dashed var(--black-12)'}}>
              <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:17,marginBottom:6}}>
                Nenhum treino ainda
              </div>
              <div style={{fontFamily:'var(--font-italic)',fontStyle:'italic',
                fontSize:14,color:'var(--fg-muted)'}}>Crie seu primeiro treino acima</div>
            </div>
          )}
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {plans.map((plan,i)=>(
              <PlanCard key={plan.id} plan={plan} idx={i}
                saving={savingId===plan.id}
                onPlay={()=>startWorkout(plan)}
                onEdit={()=>{setEditing(plan);setModal(true)}}
                onDelete={()=>delPlan(plan)}/>
            ))}
          </div>
        </>}

        {/* LIBRARY */}
        {tab==='library' && <>
          <div style={{display:'flex',gap:6,marginBottom:12,overflowX:'auto',paddingBottom:4}}>
            <button className={`pill ${mf===null?'active':''}`} onClick={()=>setMf(null)}>Todos</button>
            {Object.entries(M).map(([k,v])=>(
              <button key={k} className={`pill ${mf===k?'active':''}`}
                onClick={()=>setMf(mf===k?null:k)}>{v.l}</button>
            ))}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:7}}>
            {flib.map((ex,i)=><ExRow key={ex.id} ex={ex} delay={i*.015}/>)}
          </div>
        </>}

        {/* HISTORY */}
        {tab==='history' && <History uid={user.id}/>}
      </div>

      {/* ── Modals ── */}
      {modal && <PlanModal editing={editing} onSave={savePlan} onClose={()=>{setModal(false);setEditing(null)}}/>}
      {workout && <WorkoutPlayer plan={workout} user={user} onClose={()=>setWorkout(null)}/>}
    </div>
  )
}

// ═══════════════════════════════════════════════════════════
// ROOT
// ═══════════════════════════════════════════════════════════
function App() {
  const [session,setSession]=useState(undefined)
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>setSession(session))
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>setSession(s))
    return()=>subscription.unsubscribe()
  },[])
  if(session===undefined) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <Spinner sz={36}/>
    </div>
  )
  return session ? <MainApp user={session.user}/> : <AuthScreen/>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=>console.warn('SW falhou:', err))
  })
}
</script>
</body>
</html>
