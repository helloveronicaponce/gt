// MAIN APP
// ═══════════════════════════════════════════════════════════
function MainApp({user}) {
  const [plans,setPlans]=useState(DEFAULT_PLANS)
  const [loading,setLoading]=useState(true)
  const [savingId,setSavingId]=useState(null)
  const [tab,setTab]=useState('plans')
  const [workout,setWorkout]=useState(null)
  const [resumeData,setResumeData]=useState(null)   // snapshot a ser passado ao Player
  const [pendingWorkout,setPendingWorkout]=useState(()=>loadActiveWorkout())  // prompt de retomada
  const [modal,setModal]=useState(false)
  const [editing,setEditing]=useState(null)
  const [mf,setMf]=useState(null)
  const [showCfg,setShowCfg]=useState(false)
  const [weight,setWeight]=useState(70)
  const [goal,setGoal]=useState('hipertrofia')
  const [theme, toggleTheme] = useTheme()
  const [athlete, setAthleteState] = useState(()=> loadAthlete())
  const switchAthlete = (id) => {
    setAthleteState(id)
    saveAthlete(id)
  }

  useEffect(()=>{
    (async ()=>{
      try {
        const [pl, prof] = await Promise.all([DB.plans(user.id), DB.profile(user.id)])
        let finalPlans = pl

        if (pl.length === 0) {
          const seeded = []
          for (const def of DEFAULT_PLANS) {
            try {
              const saved = await DB.save({...def,_db:false,id:null}, user.id)
              seeded.push(saved)
            } catch(e) { console.warn('Falha ao semear', def.name, e) }
          }
          finalPlans = seeded.length ? seeded : DEFAULT_PLANS
        } else {
          const recoveryKey = `gt_recovered_defaults_v1_${user.id}`
          if (!localStorage.getItem(recoveryKey)) {
            const existingNames = new Set(pl.map(p=>p.name))
            const restored = [...pl]
            for (const def of DEFAULT_PLANS) {
              if (!existingNames.has(def.name)) {
                try {
                  const saved = await DB.save({...def,_db:false,id:null}, user.id)
                  restored.push(saved)
                } catch(e) { console.warn('Falha ao restaurar', def.name, e) }
              }
            }
            finalPlans = restored
            localStorage.setItem(recoveryKey, new Date().toISOString())
          }
        }

        setPlans(finalPlans)
        if (prof?.weight_kg) setWeight(prof.weight_kg)
        if (prof?.goal) setGoal(prof.goal)
      } catch(e) {
        console.error('Erro ao carregar:', e)
      } finally {
        setLoading(false)
      }
    })()
  },[user.id])

  const saveProfile = useCallback((u)=>DB.saveProfile(user.id,u).catch(()=>{}),[user.id])

  const savePlan = async plan=>{
    setModal(false); setEditing(null)
    const tempKey = plan.id || `tmp_${Date.now()}`
    setSavingId(tempKey)
    try {
      const saved = await DB.save(plan, user.id)
      setPlans(p=>p.find(x=>x.id===saved.id) ? p.map(x=>x.id===saved.id?saved:x) : [...p,saved])
    } catch(e) { alert('Erro ao salvar: '+e.message) }
    finally { setSavingId(null) }
  }

  const delPlan = async plan=>{
    if (!confirm(`Excluir "${plan.name}"?`)) return
    setPlans(p=>p.filter(x=>x.id!==plan.id))
    if (plan._db) DB.del(plan.id).catch(()=>{})
  }

  // ⚠️ FIX PERSISTÊNCIA: ao iniciar o treino, passamos uma cópia profunda congelada
  // do plano para o WorkoutPlayer. Assim qualquer edição posterior ao plano
  // não afeta a sessão ativa.
  const startWorkout = (plan) => {
    setResumeData(null)
    setWorkout(JSON.parse(JSON.stringify(plan)))
  }

  // Retomada de treino interrompido (queda do app, recarga, descarte de aba PWA).
  // O snapshot já contém o plano congelado e os exercícios live adicionados.
  const resumeWorkout = () => {
    if (!pendingWorkout) return
    const stubPlan = {
      id: pendingWorkout.planId,
      name: pendingWorkout.planName,
      exercises: pendingWorkout.items.map(it => ({exId: it.exId, sets: it.sets, reps: it.reps}))
    }
    setResumeData(pendingWorkout)
    setWorkout(stubPlan)
    setPendingWorkout(null)
  }

  const discardPendingWorkout = () => {
    clearActiveWorkout()
    setPendingWorkout(null)
  }

  const closeWorkout = () => {
    setWorkout(null)
    setResumeData(null)
    // Não limpamos o snapshot aqui — fechar com X mantém o treino pendente,
    // pra cobrir o caso de fechamento acidental. Quem limpa é finish() ou
    // o botão "Descartar" no prompt de retomada.
    setPendingWorkout(loadActiveWorkout())
  }

  const flib = mf ? EX.filter(e=>e.m===mf) : EX
  const GOALS = [
    ['hipertrofia','Hipertrofia'],['forca','Força'],
    ['emagrecimento','Emagrecimento'],['resistencia','Resistência'],
  ]

  if(loading) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:14}}>
      <Spinner sz={36}/><div style={{fontSize:13,color:'var(--fg-muted)',fontWeight:600}}>Carregando treinos…</div>
    </div>
  )

  return (
    <div style={{maxWidth:540,margin:'0 auto',minHeight:'100vh',background:'var(--bg)'}}>

      {/* ── App header ── */}
      <div style={{padding:'20px 18px 0',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div>
          <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:28,
            letterSpacing:'var(--track-tight)',lineHeight:.95,color:'var(--fg)'}}>
            GYM<br/>TRACKER
          </div>
          <div style={{fontFamily:'var(--font-italic)',fontStyle:'italic',
            fontSize:12,color:'var(--fg-muted)',marginTop:4}}>{user.email}</div>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          {/* athlete switch */}
          <div style={{display:'flex',background:'var(--bg-inset)',borderRadius:'var(--r-pill)',
            padding:2,border:'1px solid var(--rule)'}}>
            {ATHLETES.map(a => (
              <button key={a.id} onClick={()=>switchAthlete(a.id)} style={{
                padding:'5px 11px',borderRadius:'var(--r-pill)',border:'none',
                background: athlete === a.id ? 'var(--fg)' : 'transparent',
                color: athlete === a.id ? 'var(--bg)' : 'var(--fg-muted)',
                fontSize:11,fontWeight:900,letterSpacing:'.04em',
                transition:'all .15s var(--ease)',cursor:'pointer',
              }}>{a.name}</button>
            ))}
          </div>
          <button className="btn-icon" onClick={toggleTheme} title={theme==='dark'?'Modo claro':'Modo escuro'}
            style={{fontSize:15}}>
            {theme==='dark' ? '☀' : '☾'}
          </button>
          <button className={`btn-icon ${showCfg?'active':''}`}
            onClick={()=>setShowCfg(s=>!s)} title="Configurações" style={{fontSize:16}}>⚙</button>
        </div>
      </div>

      {/* ── Settings panel ── */}
      {showCfg && (
        <div className="card fu" style={{margin:'12px 18px 0',padding:'16px 18px'}}>
          <div style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',
            color:'var(--fg-muted)',marginBottom:14}}>Configurações</div>

          {/* peso */}
          <div style={{marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>Peso</div>
            <div style={{display:'flex',alignItems:'center',gap:14}}>
              {[-5,5].map((d,bi)=>(
                <button key={d} className="btn-icon"
                  onClick={()=>{const nw=Math.max(30,Math.min(200,weight+d));setWeight(nw);saveProfile({weight_kg:nw})}}>
                  {bi===0?'−':'+'}
                </button>
              )).reduce((acc,el,i)=>i===0?[el,
                <span key="w" style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:28,
                  minWidth:60,textAlign:'center',letterSpacing:'var(--track-tight)'}}>
                  {weight}<span style={{fontSize:14,fontWeight:400,color:'var(--fg-muted)'}}>kg</span>
                </span>,acc[0]]:[...acc,el],[])}
            </div>
          </div>

          {/* objetivo */}
          <div style={{marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:10}}>Objetivo</div>
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              {GOALS.map(([k,l])=>(
                <button key={k} className={`pill ${goal===k?'active':''}`}
                  onClick={()=>{setGoal(k);saveProfile({goal:k})}}>{l}</button>
              ))}
            </div>
          </div>

          {/* export CSV */}
          <button className="btn-ghost" style={{fontSize:12,marginBottom:8}}
            onClick={async ()=>{
              const rows = await DB.allSetsForExport(user.id, athlete)
              if (!rows.length) { alert('Sem séries registradas pra exportar.'); return }
              const header = ['data','atleta','exercicio','serie','kg','reps','sessao']
              const escape = v => {
                if (v == null) return ''
                const s = String(v)
                return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s
              }
              const csv = [header.join(',')].concat(
                rows.map(r => [
                  r.completed_at, r.athlete, r.exercise_name,
                  r.set_number, r.weight_kg, r.reps, r.session_id
                ].map(escape).join(','))
              ).join('\n')
              const blob = new Blob([csv], {type:'text/csv;charset=utf-8'})
              const url = URL.createObjectURL(blob)
              const a = document.createElement('a')
              a.href = url
              a.download = `gym-tracker-${athlete}-${new Date().toISOString().slice(0,10)}.csv`
              document.body.appendChild(a); a.click()
              setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url) }, 500)
            }}>
            Exportar histórico (CSV)
          </button>

          <button className="btn-ghost" style={{fontSize:12,color:'#DC2626',borderColor:'#FCA5A5'}}
            onClick={()=>sb.auth.signOut()}
            onMouseEnter={e=>{e.currentTarget.style.background='#FEF2F2';e.currentTarget.style.color='#DC2626'}}
            onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.color='#DC2626'}}>
            Sair da conta
          </button>
        </div>
      )}

      {/* ── Tab bar ── */}
      <div style={{margin:'14px 18px 0'}} className="tab-bar">
        {[['plans','Treinos'],['library','Exercícios'],['progress','Progresso'],['history','Histórico']].map(([t,l])=>(
          <button key={t} className={`tab-btn${tab===t?' active':''}`} onClick={()=>setTab(t)}>{l}</button>
        ))}
      </div>

      {/* ── Content ── */}
      <div style={{padding:'16px 18px 96px'}}>

        {/* PLANS */}
        {tab==='plans' && <>
          <div style={{marginBottom:16,display:'flex',flexDirection:'column',gap:8}}>
            <button className="btn-primary" onClick={()=>{setEditing(null);setModal(true)}}
              style={{fontSize:12}}>
              + Criar novo treino
            </button>
            <button className="btn-ghost" onClick={()=>{
              const today = new Date().toLocaleDateString('pt-BR')
              startWorkout({id:null, name:`Treino livre — ${today}`, exercises:[]})
            }} style={{fontSize:12}}>
              + Treino livre
            </button>
          </div>
          {plans.length===0 && (
            <div style={{textAlign:'center',padding:'44px 16px',
              background:'var(--bg-card)',borderRadius:'var(--r-lg)',
              border:'2px dashed var(--rule)'}}>
              <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:17,marginBottom:6}}>
                Nenhum treino ainda
              </div>
              <div style={{fontFamily:'var(--font-italic)',fontStyle:'italic',
                fontSize:14,color:'var(--fg-muted)'}}>Crie seu primeiro treino acima</div>
            </div>
          )}
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {plans.map((plan,i)=>(
              <PlanCard key={plan.id} plan={plan} idx={i}
                saving={savingId===plan.id}
                onPlay={()=>startWorkout(plan)}
                onEdit={()=>{setEditing(plan);setModal(true)}}
                onDelete={()=>delPlan(plan)}/>
            ))}
          </div>
        </>}

        {/* LIBRARY */}
        {tab==='library' && <>
          <div style={{display:'flex',gap:6,marginBottom:12,overflowX:'auto',paddingBottom:4}}>
            <button className={`pill ${mf===null?'active':''}`} onClick={()=>setMf(null)}>Todos</button>
            {Object.entries(M).map(([k,v])=>(
              <button key={k} className={`pill ${mf===k?'active':''}`}
                onClick={()=>setMf(mf===k?null:k)}>{v.l}</button>
            ))}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:7}}>
            {flib.map((ex,i)=><ExRow key={ex.id} ex={ex} delay={i*.015}/>)}
          </div>
        </>}

        {/* PROGRESS */}
        {tab==='progress' && <ProgressTab uid={user.id} athlete={athlete}/>}

        {/* HISTORY */}
        {tab==='history' && <History uid={user.id} athlete={athlete}/>}
      </div>

      {/* ── Modals ── */}
      {modal && <PlanModal editing={editing} onSave={savePlan} onClose={()=>{setModal(false);setEditing(null)}}/>}
      {workout && <WorkoutPlayer plan={workout} user={user} athlete={athlete} resume={resumeData} onClose={closeWorkout}/>}

      {/* ── Prompt de retomada de treino interrompido ── */}
      {pendingWorkout && !workout && (
        <ResumeWorkoutPrompt
          snapshot={pendingWorkout}
          onResume={resumeWorkout}
          onDiscard={discardPendingWorkout}
        />
      )}
    </div>
  )
}

// ═══════════════════════════════════════════════════════════
// RESUME WORKOUT PROMPT
// ═══════════════════════════════════════════════════════════
// Aparece quando o usuário reabre o app e existe um treino salvo
// em localStorage (queda, recarga, descarte da aba PWA pelo iOS).
function ResumeWorkoutPrompt({snapshot, onResume, onDiscard}) {
  const total = snapshot.items?.length || 0
  const done  = snapshot.doneKeys?.length || 0
  // Usa startedAt (e não savedAt) — savedAt muda a cada toggle/visibilitychange.
  const refTime = snapshot.startedAt || snapshot.savedAt || Date.now()
  const minsAgo = Math.max(1, Math.round((Date.now() - refTime) / 60000))
  const agoLabel = minsAgo < 60
    ? `há ${minsAgo} min`
    : `há ${Math.round(minsAgo/60)} h`

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(15,15,15,.65)',zIndex:350,
      display:'flex',alignItems:'center',justifyContent:'center',padding:18}}>
      <div className="su" style={{background:'var(--bg-card)',borderRadius:'var(--r-lg)',
        maxWidth:380,width:'100%',padding:'24px 22px',
        boxShadow:'0 12px 48px rgba(0,0,0,.32)'}}>

        <div style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',
          color:'var(--fg-muted)',marginBottom:10}}>
          Treino em andamento
        </div>

        <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:24,
          letterSpacing:'var(--track-tight)',lineHeight:1.05,color:'var(--fg)',marginBottom:6}}>
          {snapshot.planName || 'Treino sem nome'}
        </div>

        <div style={{fontFamily:'var(--font-italic)',fontStyle:'italic',
          fontSize:14,color:'var(--fg-muted)',marginBottom:18}}>
          {done}/{total} concluídos · iniciado {agoLabel}
        </div>

        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          <button className="btn-primary" onClick={onResume} style={{fontSize:13}}>
            → Retomar treino
          </button>
          <button className="btn-ghost" onClick={onDiscard} style={{fontSize:12}}>
            Descartar
          </button>
        </div>
      </div>
    </div>
  )
}

function App() {
  const [session,setSession]=useState(undefined)
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>setSession(session))
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,s)=>setSession(s))
    return()=>subscription.unsubscribe()
  },[])
  if(session===undefined) return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
      <Spinner sz={36}/>
    </div>
  )
  return session ? <MainApp user={session.user}/> : <AuthScreen/>
}
