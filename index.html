    /* ── Verônica Design System tokens ─────────────────────── */
    :root {
      --off-white: #FFFCF4;
      --black:     #0F0F0F;
      --pink:      #FF8FB8;
      --lime:      #D4FF3D;

      --black-80:  rgba(15,15,15,0.80);
      --black-60:  rgba(15,15,15,0.60);
      --black-40:  rgba(15,15,15,0.40);
      --black-12:  rgba(15,15,15,0.12);
      --off-92:    rgba(255,252,244,0.92);

      /* ── Tipografia ── */
      --font-display: 'Inter', system-ui, sans-serif;
      --font-italic:  'EB Garamond', Georgia, serif;
      --font-body:    'Inter', system-ui, sans-serif;

      --weight-black:   900;
      --weight-regular: 400;

      --t-h1:    clamp(42px, 7vw, 96px);
      --t-h2:    28px;
      --t-body:  16px;
      --t-sm:    14px;
      --t-xs:    12px;
      --t-cap:   11px;

      --lh-tight: 0.92;
      --lh-snug:  1.10;
      --lh-body:  1.50;

      --track-tight: -0.02em;
      --track-cap:    0.08em;

      /* ── Espaçamento ── */
      --s-1:  4px;
      --s-2:  8px;
      --s-3: 12px;
      --s-4: 16px;
      --s-5: 24px;
      --s-6: 32px;

      /* ── Raio ── */
      --r-sm:   10px;
      --r-md:   16px;
      --r-lg:   22px;
      --r-pill: 999px;

      /* ── Sombra base ── */
      --shadow-1: 0 2px 6px  rgba(15,15,15,0.05);
      --shadow-2: 0 6px 20px rgba(15,15,15,0.08);

      /* ── Motion ── */
      --ease: cubic-bezier(0.32,0.72,0,1);
      --dur: 200ms;

      /* ── Light mode (default) ── */
      --bg:          #FFFCF4;
      --bg-card:     #FFFCF4;
      --bg-inset:    rgba(15,15,15,0.04);
      --fg:          #0F0F0F;
      --fg-muted:    rgba(15,15,15,0.55);
      --rule:        rgba(15,15,15,0.10);
      --rule-strong: rgba(15,15,15,0.20);
      --accent:      var(--pink);
      --shadow-card: 0 2px 12px rgba(15,15,15,0.07);
      --btn-primary-bg: #0F0F0F;
      --btn-primary-fg: #FFFCF4;
    }

    /* ── Dark mode ── */
    html.dark {
      --bg:          #0F0F0F;
      --bg-card:     #1C1C1C;
      --bg-inset:    rgba(255,252,244,0.10);
      --fg:          #FFFCF4;
      --fg-muted:    rgba(255,252,244,0.45);
      --rule:        rgba(255,252,244,0.10);
      --rule-strong: rgba(255,252,244,0.18);
      --shadow-card: 0 2px 12px rgba(0,0,0,0.40);
      --btn-primary-bg: #FFFCF4;
      --btn-primary-fg: #0F0F0F;
    }

    @media (prefers-color-scheme: dark) {
      html:not(.light) {
        --bg:          #0F0F0F;
        --bg-card:     #1C1C1C;
        --bg-inset:    rgba(255,252,244,0.10);
        --fg:          #FFFCF4;
        --fg-muted:    rgba(255,252,244,0.45);
        --rule:        rgba(255,252,244,0.10);
        --rule-strong: rgba(255,252,244,0.18);
        --shadow-card: 0 2px 12px rgba(0,0,0,0.40);
        --btn-primary-bg: #FFFCF4;
        --btn-primary-fg: #0F0F0F;
      }
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      font-family:var(--font-body);
      background:var(--bg);
      color:var(--fg);
      font-size:var(--t-body);
      line-height:var(--lh-body);

    @keyframes slideUp{from{opacity:0;transform:translateY(100%)}to{opacity:1;transform:translateY(0)}}

      font-family:var(--font-body);font-size:var(--t-sm);font-weight:900;
      letter-spacing:var(--track-cap);text-transform:uppercase;

      border-radius:var(--r-md);
      display:flex;align-items:center;justify-content:center;gap:8px;
      box-shadow:var(--shadow-card);
      transition:transform var(--dur) var(--ease),opacity var(--dur) var(--ease);
    }
    .btn-primary:disabled{background:var(--rule-strong);color:var(--fg-muted);box-shadow:none;cursor:not-allowed}
    .btn-primary:not(:disabled):active{transform:scale(.97)}

    /* Variante lima */
    .btn-lime{background:var(--lime);color:var(--black)}
    .btn-lime:hover{background:#c5f024}

    /* ── Ghost button ── */
    .btn-ghost{
      width:100%;padding:13px;
      font-family:var(--font-body);font-size:var(--t-sm);font-weight:700;
      color:var(--fg);background:transparent;
      border:1.5px solid var(--rule-strong);border-radius:var(--r-md);
      display:flex;align-items:center;justify-content:center;gap:8px;
      transition:all var(--dur) var(--ease);
    }
    .btn-ghost:hover{border-color:var(--fg);background:var(--fg);color:var(--bg)}

    /* ── Icon button ── */
    .btn-icon{
      width:40px;height:40px;border-radius:var(--r-sm);
      display:flex;align-items:center;justify-content:center;
      border:1.5px solid var(--rule);background:var(--bg-card);
      color:var(--fg-muted);font-size:15px;
      transition:all var(--dur) var(--ease);
    }
    .btn-icon:hover{border-color:var(--fg);color:var(--fg)}
    .btn-icon.danger:hover{background:rgba(220,38,38,0.10);border-color:#FCA5A5;color:#DC2626}
    .btn-icon.active{background:var(--fg);border-color:var(--fg);color:var(--bg)}

    /* ── Pill filter ── */
    .pill{
      padding:7px 14px;border-radius:var(--r-pill);font-size:var(--t-xs);font-weight:700;
      white-space:nowrap;border:1.5px solid var(--rule);
      background:var(--bg-card);color:var(--fg-muted);
      transition:all var(--dur) var(--ease);
    }
    .pill.active{background:var(--fg);color:var(--bg);border-color:var(--fg)}

    /* ── Tab bar ── */
    .tab-bar{
      display:flex;background:var(--bg-card);
      border-radius:var(--r-md);padding:4px;
      border:1.5px solid var(--rule);box-shadow:var(--shadow-card);
    }
    .tab-btn{
      flex:1;padding:9px 4px;border-radius:var(--r-sm);

    .tab-btn.active{background:var(--fg);color:var(--bg);box-shadow:var(--shadow-card)}

      padding:3px 9px;border-radius:var(--r-pill);

  </style>
</head>

// ═══════════════════════════════════════════════════════════
// DARK MODE
// ═══════════════════════════════════════════════════════════
function initTheme() {
  const saved = localStorage.getItem('gt_theme')
  if (saved === 'dark')  { document.documentElement.classList.add('dark');  document.documentElement.classList.remove('light'); return 'dark' }
  if (saved === 'light') { document.documentElement.classList.add('light'); document.documentElement.classList.remove('dark');  return 'light' }
  // Sem preferência salva — deixa o @media prefers-color-scheme agir
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
}
const _initTheme = initTheme() // roda imediatamente ao carregar o script

function useTheme() {
  const [theme, setTheme] = useState(_initTheme)
  const toggle = useCallback(() => {
    setTheme(t => {
      const next = t === 'dark' ? 'light' : 'dark'
      localStorage.setItem('gt_theme', next)
      document.documentElement.classList.toggle('dark',  next === 'dark')
      document.documentElement.classList.toggle('light', next === 'light')
      return next
    })
  }, [])
  return [theme, toggle]
}

  {id:'veronica', name:'Verô',  short:'V'},
  {id:'diego',    name:'Diego', short:'D'},
]

const loadAthlete = () => {
  try {
    const v = localStorage.getItem(ATHLETE_KEY)
    return ATHLETES.find(a => a.id === v) ? v : 'veronica'
  } catch(e) { return 'veronica' }
}
const saveAthlete = (id) => {
  try { localStorage.setItem(ATHLETE_KEY, id) } catch(e) {}
}

const loadActiveWorkout = () => {
  try {
    const raw = localStorage.getItem(ACTIVE_WORKOUT_KEY)
    if (!raw) return null
    const snap = JSON.parse(raw)
    if (!snap || typeof snap !== 'object') return null
    if (!snap.savedAt || Date.now() - snap.savedAt > ACTIVE_WORKOUT_TTL_MS) {
      localStorage.removeItem(ACTIVE_WORKOUT_KEY)
      return null
    }
    if (!Array.isArray(snap.items) || snap.items.length === 0) return null
    return snap
  } catch(e) { return null }
}

const clearActiveWorkout = () => {
  try { localStorage.removeItem(ACTIVE_WORKOUT_KEY) } catch(e) {}
}

// ═══════════════════════════════════════════════════════════
// SUPABASE HELPERS
// ═══════════════════════════════════════════════════════════
const DB = {
  async plans(uid) {
    const {data} = await sb.from('plans').select('*,plan_exercises(*)').eq('user_id',uid).order('created_at')
    return (data||[]).map(p=>({
      id:p.id, _db:true, name:p.name,
      exercises:(p.plan_exercises||[])
        .sort((a,b)=>a.position-b.position)
        .map(e=>({exId:+e.exercise_id,sets:e.sets,reps:isNaN(e.reps)?e.reps:+e.reps}))
    }))
  },
  async save(plan, uid) {
    let pid = plan._db ? plan.id : null
    if (!pid) {
      const {data} = await sb.from('plans').insert({name:plan.name,user_id:uid}).select().single()
      pid = data.id
    } else {
      await sb.from('plans').update({name:plan.name}).eq('id',pid)
      await sb.from('plan_exercises').delete().eq('plan_id',pid)
    }
    if (plan.exercises.length) {
      await sb.from('plan_exercises').insert(
        plan.exercises.map((e,i)=>({
          plan_id:pid, exercise_id:e.exId,
          exercise_name:EX.find(x=>x.id===e.exId)?.name||'',
          sets:e.sets, reps:String(e.reps), position:i
        }))
      )
    }
    return {...plan, id:pid, _db:true}
  },
  async del(id) { await sb.from('plans').delete().eq('id',id) },
  async startSession(uid, athlete, plan, kcal) {
    const {data} = await sb.from('workout_sessions').insert({
      user_id:uid, athlete: athlete || 'veronica',
      plan_id:plan._db?plan.id:null,
      plan_name:plan.name, exercises_total:plan.exercises.length, kcal_estimate:kcal
    }).select().single()
    return data?.id
  },
  async finishSession(sid, done, mins) {
    if (!sid) return
    await sb.from('workout_sessions').update({
      exercises_done:done, duration_minutes:mins, finished_at:new Date().toISOString()
    }).eq('id',sid)
  },
  // Salva uma série concluída na nova tabela workout_sets.
  async saveSet(sid, uid, athlete, exId, exName, n, kg, reps, restSec) {
    if (!sid || !uid) return
    await sb.from('workout_sets').insert({
      session_id: sid, user_id: uid, athlete: athlete || 'veronica',
      exercise_id: exId, exercise_name: exName,
      set_number: n,
      weight_kg: kg ?? null, reps: reps ?? null,
      rest_seconds_taken: restSec ?? null
    })
  },
  // Busca a última série registrada para um exercício pelo atleta corrente.
  // Usado para sugerir carga ao iniciar o treino.
  async lastSet(uid, athlete, exId) {
    const {data} = await sb.from('workout_sets')
      .select('weight_kg, reps')
      .eq('user_id', uid)
      .eq('athlete', athlete || 'veronica')
      .eq('exercise_id', exId)
      .order('completed_at', {ascending:false})
      .limit(1)
    return data?.[0] || null
  },
  // Tier 2: dados pra a tab Progresso. 12 semanas é o suficiente
  // pra calendário de consistência e tendência por exercício.
  async recentSets(uid, athlete, sinceISO) {
    const {data} = await sb.from('workout_sets')
      .select('exercise_id, exercise_name, weight_kg, reps, completed_at, session_id')
      .eq('user_id', uid)
      .eq('athlete', athlete || 'veronica')
      .gte('completed_at', sinceISO)
      .order('completed_at', {ascending:true})
    return data || []
  },
  async recentSessions(uid, athlete, sinceISO) {
    const {data} = await sb.from('workout_sessions')
      .select('id, plan_name, started_at, finished_at, exercises_done, exercises_total')
      .eq('user_id', uid)
      .eq('athlete', athlete || 'veronica')
      .gte('started_at', sinceISO)
      .order('started_at', {ascending:true})
    return data || []
  },
  // Tier 3: bioimpedância da Jornada (só Verô). Lê últimas 90 entradas
  // pra alimentar o gráfico de evolução em ProgressTab.
  async bioimpedancia(uid, daysBack) {
    const since = new Date(Date.now() - (daysBack||90) * 24*60*60*1000).toISOString().slice(0,10)
    const {data} = await sb.from('jornada_bioimpedancia')
      .select('data, peso, gordura_pct, massa_musc_total_kg, gordura_visceral')
      .eq('user_id', uid)
      .gte('data', since)
      .order('data', {ascending:true})
    return data || []
  },
  // Tier 3: dump completo de séries pra export CSV. Sem limite de período.
  async allSetsForExport(uid, athlete) {
    const {data} = await sb.from('workout_sets')
      .select('completed_at, athlete, exercise_name, set_number, weight_kg, reps, session_id')
      .eq('user_id', uid)
      .eq('athlete', athlete || 'veronica')
      .order('completed_at', {ascending:true})
    return data || []
  },
  async history(uid, athlete) {
    const {data} = await sb.from('workout_sessions').select('*')
      .eq('user_id',uid)
      .eq('athlete', athlete || 'veronica')
      .order('started_at',{ascending:false}).limit(20)
    return data||[]
  },
  async profile(uid) {
    const {data} = await sb.from('profiles').select('*').eq('id',uid).single()
    return data
  },
  async saveProfile(uid, u) {
    await sb.from('profiles').upsert({id:uid,...u,updated_at:new Date().toISOString()})
  },
}

// ═══════════════════════════════════════════════════════════
// SVG STICK FIGURE ANIMATIONS
// ═══════════════════════════════════════════════════════════
const sk = c=>({stroke:c,strokeWidth:'2.5',strokeLinecap:'round',fill:'none'})
const AT = p=><animateTransform attributeName="transform" repeatCount="indefinite" {...p}/>
const SV = ({ch})=><svg viewBox="0 0 60 90" style={{width:'100%',height:'100%',overflow:'visible'}}>{ch}</svg>
const SW = ({ch})=><svg viewBox="0 0 88 56" style={{width:'100%',height:'100%',overflow:'visible'}}>{ch}</svg>

const H  = c=><circle cx="30" cy="9"  r="7" {...sk(c)}/>
const Bd = c=><line x1="30" y1="16" x2="30" y2="44" {...sk(c)}/>
const UL = c=><line x1="30" y1="24" x2="12" y2="37" {...sk(c)}/>
const UR = c=><line x1="30" y1="24" x2="48" y2="37" {...sk(c)}/>
const FL = c=><line x1="12" y1="37" x2="9"  y2="51" {...sk(c)}/>
const FR = c=><line x1="48" y1="37" x2="51" y2="51" {...sk(c)}/>
const TL = c=><line x1="24" y1="44" x2="21" y2="62" {...sk(c)}/>
const TR = c=><line x1="36" y1="44" x2="39" y2="62" {...sk(c)}/>
const SL = c=><line x1="21" y1="62" x2="17" y2="78" {...sk(c)}/>
const SR = c=><line x1="39" y1="62" x2="43" y2="78" {...sk(c)}/>
const Lg = c=><>{TL(c)}{SL(c)}{TR(c)}{SR(c)}</>
const Al = c=><>{H(c)}{Bd(c)}{UL(c)}{FL(c)}{UR(c)}{FR(c)}{Lg(c)}</>
const NF = c=><>{H(c)}{Bd(c)}{UL(c)}{UR(c)}{Lg(c)}</>
const NA = c=><>{H(c)}{Bd(c)}{Lg(c)}</>
const NL = c=><>{H(c)}{Bd(c)}{UL(c)}{FL(c)}{UR(c)}{FR(c)}{TR(c)}{SR(c)}</>

const ANIM = {
  squat:   c=><SV ch={<g><AT type="translate" values="0,0;0,13;0,0" dur="2s"/>{Al(c)}</g>}/>,
  lunge:   c=><SV ch={<g><AT type="translate" values="0,0;0,9;0,0"  dur="2s"/>{Al(c)}</g>}/>,
  calf:    c=><SV ch={<g><AT type="translate" values="0,0;0,-9;0,0" dur="1.5s"/>{Al(c)}</g>}/>,
  pullup:  c=><SV ch={<g><AT type="translate" values="0,0;0,-13;0,0" dur="2s"/>{Al(c)}</g>}/>,
  push:    c=><SV ch={<>{NF(c)}<g><AT type="rotate" values="0 12 37;65 12 37;0 12 37" dur="1.5s"/>{FL(c)}</g><g><AT type="rotate" values="0 48 37;-65 48 37;0 48 37" dur="1.5s"/>{FR(c)}</g></>}/>,
  pushv:   c=><SV ch={<>{NA(c)}<g><AT type="rotate" values="0 30 24;80 30 24;0 30 24" dur="1.5s"/>{UL(c)}{FL(c)}</g><g><AT type="rotate" values="0 30 24;-80 30 24;0 30 24" dur="1.5s"/>{UR(c)}{FR(c)}</g></>}/>,
  curl:    c=><SV ch={<>{NF(c)}<g><AT type="rotate" values="0 12 37;115 12 37;0 12 37" dur="1.5s"/>{FL(c)}</g><g><AT type="rotate" values="0 48 37;-115 48 37;0 48 37" dur="1.5s"/>{FR(c)}</g></>}/>,
  pullh:   c=><SV ch={<>{NF(c)}<g><AT type="rotate" values="0 12 37;85 12 37;0 12 37" dur="1.8s"/>{FL(c)}</g><g><AT type="rotate" values="0 48 37;-85 48 37;0 48 37" dur="1.8s"/>{FR(c)}</g></>}/>,
  lateral: c=><SV ch={<>{NA(c)}<g><AT type="rotate" values="0 30 24;45 30 24;0 30 24" dur="1.5s"/>{UL(c)}{FL(c)}</g><g><AT type="rotate" values="0 30 24;-45 30 24;0 30 24" dur="1.5s"/>{UR(c)}{FR(c)}</g></>}/>,
  hinge:   c=><SV ch={<><g><AT type="rotate" values="0 30 44;40 30 44;0 30 44" dur="2s"/>{H(c)}{Bd(c)}{UL(c)}{FL(c)}{UR(c)}{FR(c)}</g>{Lg(c)}</>}/>,
  crunch:  c=><SV ch={<><g><AT type="translate" values="0,0;3,9;0,0" dur="1.5s"/>{H(c)}<line x1="30" y1="16" x2="30" y2="34" {...sk(c)}/></g><line x1="30" y1="34" x2="30" y2="44" {...sk(c)}/>{UL(c)}{FL(c)}{UR(c)}{FR(c)}{Lg(c)}</>}/>,
  plank:   c=><SW ch={<g {...sk(c)}><AT type="translate" values="0,0;0,-3;0,0" dur="3s"/><circle cx="76" cy="20" r="6"/><line x1="70" y1="20" x2="14" y2="20"/><line x1="56" y1="20" x2="53" y2="34"/><line x1="53" y1="34" x2="42" y2="34"/><line x1="36" y1="20" x2="33" y2="34"/><line x1="33" y1="34" x2="22" y2="34"/><line x1="14" y1="20" x2="5" y2="20"/></g>}/>,
  rotation:c=><SV ch={<><g><AT type="rotate" values="0 30 44;-22 30 44;22 30 44;-22 30 44;0 30 44" dur="2.5s"/>{H(c)}{Bd(c)}{UL(c)}{FL(c)}{UR(c)}{FR(c)}</g>{Lg(c)}</>}/>,
  legraise:c=><SV ch={<>{NL(c)}<g><AT type="rotate" values="0 24 44;125 24 44;0 24 44" dur="2s"/>{TL(c)}{SL(c)}</g></>}/>,
}
const ExAnim = ({ak,c})=>{ const A=ANIM[ak]||ANIM.push; return A(c) }

// ═══════════════════════════════════════════════════════════
// AUTH SCREEN
// ═══════════════════════════════════════════════════════════
function AuthScreen() {
  const [mode,setMode]=useState('login')   // 'login' | 'signup'
  const [email,setEmail]=useState('')
  const [password,setPassword]=useState('')
  const [busy,setBusy]=useState(false)
  const [err,setErr]=useState('')
  const [info,setInfo]=useState('')

  const submit = async ()=>{
    if(!email.trim() || !password) return
    if (mode === 'signup' && password.length < 6) {
      setErr('Senha precisa de pelo menos 6 caracteres.'); return
    }
    setBusy(true); setErr(''); setInfo('')
    try {
      if (mode === 'signup') {
        const {data, error} = await sb.auth.signUp({
          email: email.trim(), password
        })
        if (error) {
          setErr(error.message)
        } else if (!data.session) {
          // Email confirmation está habilitado no Supabase — avisa.
          setInfo('Conta criada. Confirme o e-mail enviado pra entrar (ou desligue "Confirm email" no Supabase Studio se quiser entrar direto).')
        }
      } else {
        const {error} = await sb.auth.signInWithPassword({
          email: email.trim(), password
        })
        if (error) setErr(error.message === 'Invalid login credentials' ? 'E-mail ou senha incorretos.' : error.message)
      }
    } catch(e) {
      setErr(e.message || 'Erro inesperado')
    }
    setBusy(false)
  }

  const isSignup = mode === 'signup'
  const inputBaseStyle = {
    width:'100%',padding:'14px 16px',fontSize:16,
    background:'rgba(255,252,244,0.07)',fontFamily:'var(--font-body)',
    border:'1.5px solid rgba(255,252,244,0.15)',borderRadius:'var(--r-md)',
    color:'var(--off-white)',marginBottom:12,outline:'none'
  }

  return (
    <div style={{minHeight:'100vh',background:'var(--black)',display:'flex',flexDirection:'column',
                 alignItems:'center',justifyContent:'center',padding:'32px 24px'}}>
      {/* Logo block */}
      <div style={{textAlign:'center',marginBottom:40}}>
        <div style={{
          width:72,height:72,borderRadius:'var(--r-lg)',
          background:'var(--lime)',
          display:'flex',alignItems:'center',justifyContent:'center',
          margin:'0 auto 20px',
        }}>
          <span style={{fontSize:32,fontFamily:'var(--font-display)',fontWeight:900,color:'var(--black)'}}>GT</span>
        </div>
        <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:40,letterSpacing:'-0.03em',
          color:'var(--off-white)',lineHeight:.95}}>
          GYM<br/>TRACKER
        </div>
        <div style={{fontFamily:'var(--font-italic)',fontStyle:'italic',fontSize:16,
          color:'rgba(255,252,244,0.55)',marginTop:10}}>
          seus treinos, seu ritmo
        </div>
      </div>

      <div style={{width:'100%',maxWidth:360}}>
        {/* tabs login/cadastro */}
        <div style={{display:'flex',gap:4,padding:3,marginBottom:18,
          background:'rgba(255,252,244,0.05)',borderRadius:'var(--r-pill)'}}>
          {[['login','Entrar'],['signup','Cadastrar']].map(([k,l])=>(
            <button key={k} onClick={()=>{setMode(k);setErr('');setInfo('')}}
              style={{
                flex:1,padding:'9px 12px',borderRadius:'var(--r-pill)',border:'none',
                background: mode === k ? 'var(--lime)' : 'transparent',
                color: mode === k ? 'var(--black)' : 'rgba(255,252,244,0.55)',
                fontSize:12,fontWeight:900,letterSpacing:'.04em',textTransform:'uppercase',
                transition:'all .15s var(--ease)',cursor:'pointer',
              }}>{l}</button>
          ))}
        </div>

        <label style={{fontSize:12,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',
          color:'rgba(255,252,244,0.50)',display:'block',marginBottom:8}}>
          E-mail
        </label>
        <input type="email" placeholder="nome@exemplo.com" value={email}
          onChange={e=>setEmail(e.target.value)} autoComplete="email"
          style={inputBaseStyle}
          onFocus={e=>e.target.style.borderColor='var(--lime)'}
          onBlur={e=>e.target.style.borderColor='rgba(255,252,244,0.15)'}
        />

        <label style={{fontSize:12,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',
          color:'rgba(255,252,244,0.50)',display:'block',marginBottom:8}}>
          Senha {isSignup && <span style={{textTransform:'none',letterSpacing:0,fontWeight:400,
            color:'rgba(255,252,244,0.35)'}}>· mín. 6 caracteres</span>}
        </label>
        <input type="password" placeholder="••••••••" value={password}
          onChange={e=>setPassword(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&submit()}
          autoComplete={isSignup ? 'new-password' : 'current-password'}
          style={inputBaseStyle}
          onFocus={e=>e.target.style.borderColor='var(--lime)'}
          onBlur={e=>e.target.style.borderColor='rgba(255,252,244,0.15)'}
        />

        {err && <div style={{padding:'10px 14px',background:'rgba(220,38,38,0.15)',border:'1px solid rgba(220,38,38,0.4)',
          borderRadius:'var(--r-sm)',color:'#FCA5A5',fontSize:13,fontWeight:600,marginBottom:12}}>{err}</div>}
        {info && <div style={{padding:'10px 14px',background:'rgba(212,255,61,0.10)',border:'1px solid rgba(212,255,61,0.30)',
          borderRadius:'var(--r-sm)',color:'rgba(212,255,61,0.90)',fontSize:13,fontWeight:600,marginBottom:12}}>{info}</div>}

        <button className="btn-primary btn-lime" onClick={submit} disabled={busy||!email.trim()||!password}
          style={{fontSize:13}}>
          {busy ? <Spinner sz={18} c="var(--black)"/> : (isSignup ? '→ Criar conta' : '→ Entrar')}
        </button>

        <div style={{textAlign:'center',marginTop:14,fontSize:12,color:'rgba(255,252,244,0.35)'}}>
          {isSignup ? 'Cadastra a primeira vez. Depois é só entrar.' : 'Acessa com e-mail e senha.'}
        </div>
      </div>
    </div>
  )
}

// ═══════════════════════════════════════════════════════════
// PLAN CARD
// ═══════════════════════════════════════════════════════════
function PlanCard({plan, idx, onPlay, onEdit, onDelete, saving}) {
  const muscles = [...new Set(plan.exercises.map(e=>EX.find(x=>x.id===e.exId)?.m).filter(Boolean))]
  const totalSets = plan.exercises.reduce((s,e)=>s+e.sets,0)
  const exPrev = plan.exercises.slice(0,6)

  return (
    <div className="card fu" style={{overflow:'hidden',animationDelay:`${idx*.07}s`}}>
      {/* top accent bar — lima em light, rosa em dark */}
      <div style={{height:3,background:'var(--lime)',borderRadius:'var(--r-lg) var(--r-lg) 0 0',margin:'-1.5px -1.5px 0 -1.5px'}}/>

      <div style={{padding:'18px 18px 16px'}}>
        {/* header row */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
          <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:18,
            letterSpacing:'var(--track-tight)',lineHeight:1.1,flex:1,paddingRight:8}}>
            {plan.name}
          </div>
          <div style={{display:'flex',gap:6,alignItems:'center',flexShrink:0}}>
            {saving && <Spinner sz={16}/>}
            <button className="btn-icon" onClick={onEdit} title="Editar" style={{fontSize:13}}>✏️</button>
            <button className="btn-icon danger" onClick={onDelete} title="Excluir" style={{fontSize:13}}>🗑</button>
          </div>
        </div>

        {/* stats */}
        <div style={{display:'flex',gap:6,marginBottom:10,flexWrap:'wrap'}}>
          {[[`${plan.exercises.length} ex.`],[`${totalSets} séries`]].map(([v])=>(
            <span key={v} className="capsule" style={{fontSize:10}}>{v}</span>
          ))}
          {muscles.map(k=><MChip key={k} mKey={k} small/>)}
        </div>

        {/* mini anim row */}
        <div style={{display:'flex',gap:4,marginBottom:14,flexWrap:'wrap'}}>
          {exPrev.map(e=>{
            const ex=EX.find(x=>x.id===e.exId);if(!ex)return null
            const m=M[ex.m], animC=m.bg==='#0F0F0F'?'#FFFCF4':m.c
            return (
              <div key={e.exId} title={ex.name}
                style={{width:28,height:28,background:m.bg,borderRadius:'var(--r-sm)',padding:3,flexShrink:0}}>
                <ExAnim ak={ex.a} c={animC}/>
              </div>
            )
          })}
          {plan.exercises.length > 6 && (
            <div style={{width:28,height:28,borderRadius:'var(--r-sm)',background:'var(--bg-inset)',
              display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'var(--fg-muted)'}}>
              +{plan.exercises.length-6}
            </div>
          )}
        </div>

        {/* CTA */}
        <button className="btn-primary" onClick={onPlay}>
          ▶ Iniciar treino
        </button>
      </div>
    </div>
  )
}

          {/* muscle filter */}
          <div style={{display:'flex',gap:6,overflowX:'auto',paddingBottom:2}}>
            <button className={`pill ${mf===null?'active':''}`}
              onClick={()=>setMf(null)}>Todos</button>
            {Object.entries(M).map(([k,v])=>(
              <button key={k} className={`pill ${mf===k?'active':''}`}
                onClick={()=>setMf(mf===k?null:k)}>{v.l}</button>
            ))}
          </div>
        </div>

        {/* list */}
        <div style={{flex:1,overflowY:'auto',padding:'12px 16px',display:'flex',flexDirection:'column',gap:7}}>
          {filtered.map((ex,i)=>(
            <ExRow key={ex.id} ex={ex} compact delay={i*.015}
              onClick={()=>{onAdd(ex); onClose()}}/>
          ))}
          {filtered.length===0 && (
            <div style={{textAlign:'center',padding:'32px 0',color:'var(--fg-muted)',fontSize:14}}>
              Nenhum exercício encontrado.
            </div>
          )}
        </div>
      </div>
    </div>
  )
}

// ═══════════════════════════════════════════════════════════
// REST COUNTDOWN — força re-render a cada 250ms enquanto roda
// ═══════════════════════════════════════════════════════════
function RestCountdown({end}) {
  const [now, setNow] = useState(Date.now())
  useEffect(()=>{
    const id = setInterval(()=>setNow(Date.now()), 250)
    return ()=> clearInterval(id)
  },[end])
  const left = Math.max(0, end - now)
  const m = Math.floor(left/60000)
  const s = Math.floor((left%60000)/1000)
  return <span>{m}:{String(s).padStart(2,'0')}</span>
}

// ═══════════════════════════════════════════════════════════
// WORKOUT PLAYER  — fix persistência + add-mid-workout
// ═══════════════════════════════════════════════════════════
function WorkoutPlayer({plan, user, athlete, onClose, resume}) {
  // Inicializa o array de séries de um exercício (n entradas vazias).
  // +n converte string→número; Math.floor garante inteiro; ||1 cobre NaN/0/undefined.
  const initSetsLog = (n) => {
    const count = Math.max(1, Math.floor(+n) || 1)
    return Array.from({length: count}, (_,i)=>({n:i+1, kg:null, reps:null, done:false}))
  }

  // Cada item do treino agora carrega seu próprio setsLog — array de séries
  // com kg/reps/done individuais. Substitui o checkbox único do exercício.
  const [items, setItems] = useState(()=> {
    if (resume?.items?.length) {
      return resume.items
        .map(it => ({
          ...it,
          ex: EX.find(x=>x.id===it.exId),
          // Garante que setsLog sempre tem o número correto de séries do plano.
      // Dados antigos de localStorage podem ter contagem diferente — recria nesse caso.
      setsLog: (it.setsLog && it.setsLog.length && it.setsLog.length === Math.max(1, Math.floor(+it.sets)||1))
        ? it.setsLog
        : initSetsLog(it.sets)
        }))
        .filter(it => it.ex)
    }
    return plan.exercises
      .map(e=>({...e, ex:EX.find(x=>x.id===e.exId)}))
      .filter(e=>e.ex)
      .map((e,i)=>({...e, key:`orig-${i}`, setsLog: initSetsLog(e.sets)}))
  })
  const [fin,setFin]       = useState(false)
  const [addSheet,setAddSheet] = useState(false)
  const [restEnd, setRestEnd] = useState(null)         // timestamp do fim do descanso
  const [suggestions, setSuggestions] = useState({})   // { exId: {weight_kg, reps} }
  const [activeKey, setActiveKey] = useState(()=> items[0]?.key ?? null) // accordion: exercício aberto
  const startRef = useRef(resume?.startedAt || Date.now())
  const sidRef   = useRef(resume?.sessionId || null)

  // 'done' deriva dos itens: exercício é done quando todas as séries têm done=true.
  // Calculado a cada render — barato e elimina sincronização entre dois estados.
  const doneSet = new Set(
    items
      .filter(it => it.setsLog && it.setsLog.length > 0 && it.setsLog.every(s => s.done))
      .map(it => it.key)
  )

  // Refs sincronizadas com state pra usar em listeners de visibilitychange/pagehide.
  const itemsRef = useRef(items)
  useEffect(()=>{ itemsRef.current = items }, [items])

  // Snapshot serializável do treino atual — pra localStorage.
  const buildSnapshot = ()=> {
    const itemsNow = itemsRef.current
    const doneKeys = itemsNow
      .filter(it => it.setsLog && it.setsLog.length > 0 && it.setsLog.every(s => s.done))
      .map(it => it.key)
    return {
      planName: plan.name,
      planId: plan.id || null,
      items: itemsNow.map(({ex, ...rest}) => rest),  // ex não é serializável
      doneKeys,
      startedAt: startRef.current,
      sessionId: sidRef.current,
      savedAt: Date.now()
    }
  }

  const persistSnapshot = ()=> {
    try { localStorage.setItem(ACTIVE_WORKOUT_KEY, JSON.stringify(buildSnapshot())) } catch(e) {}
  }

  // Inicia a sessão no backend (só na primeira vez — no resume já temos o id).
  useEffect(()=>{
    if (sidRef.current) return
    DB.startSession(user.id, athlete, plan, 0).then(id=>{
      sidRef.current = id
      persistSnapshot()
    }).catch(()=>{})
  },[])

  // Busca a última carga registrada de cada exercício pra sugerir e pré-popular.
  // Roda 1x no mount; se falha silencioso, usuário só não vê a sugestão.
  useEffect(()=>{
    let cancelled = false
    Promise.all(items.map(it => DB.lastSet(user.id, athlete, it.exId).catch(()=>null)))
      .then(results => {
        if (cancelled) return
        const map = {}
        items.forEach((it, idx) => {
          if (results[idx]) map[it.exId] = results[idx]
        })
        setSuggestions(map)
        // Pré-popula kg da 1ª série dos itens cuja série 1 ainda está vazia.
        setItems(prev => prev.map(it => {
          const sug = map[it.exId]
          if (!sug || !it.setsLog || !it.setsLog.length) return it
          if (it.setsLog[0].kg !== null && it.setsLog[0].kg !== undefined && it.setsLog[0].kg !== '') return it
          const nextLog = it.setsLog.map((s,i) => i === 0 ? {...s, kg: sug.weight_kg} : s)
          return {...it, setsLog: nextLog}
        }))
      })
    return ()=>{ cancelled = true }
  },[])

  // Persiste a cada mudança nos items.
  useEffect(()=>{ persistSnapshot() }, [items])

  // Salva também quando a aba some (iOS descarta a aba antes do React desmontar).
  useEffect(()=>{
    const onHide = ()=> persistSnapshot()
    window.addEventListener('pagehide', onHide)
    document.addEventListener('visibilitychange', onHide)
    return ()=>{
      window.removeEventListener('pagehide', onHide)
      document.removeEventListener('visibilitychange', onHide)
    }
  },[])

  // Cronômetro de descanso: vibra ao chegar em 0 e auto-encerra.
  // useEffect dispara quando restEnd muda; clear no unmount.
  useEffect(()=>{
    if (!restEnd) return
    const tick = ()=>{
      if (Date.now() >= restEnd) {
        try { navigator.vibrate && navigator.vibrate([300, 100, 300]) } catch(e) {}
        setRestEnd(null)
      }
    }
    const id = setInterval(tick, 250)
    return ()=> clearInterval(id)
  },[restEnd])

  // Marca/desmarca uma série como concluída.
  // Quando vira done=true: dispara cronômetro de 90s e persiste no Supabase.
  // Quando TODAS as séries de um exercício ficam done, auto-avança para o próximo.
  const toggleSet = (itemKey, setN) => {
    const it = items.find(i => i.key === itemKey)
    const s  = it?.setsLog.find(x => x.n === setN)
    const willBeDone = s && !s.done
    // Verifica se marcar esta série vai completar o exercício inteiro
    const wouldCompleteEx = willBeDone && it.setsLog.every(x => x.n === setN ? true : x.done)
    setItems(prev => prev.map(item => {
      if (item.key !== itemKey) return item
      return {
        ...item,
        setsLog: item.setsLog.map(x => x.n === setN ? {...x, done: !x.done} : x)
      }
    }))
    if (wouldCompleteEx) {
      // Avança para o próximo exercício não concluído após breve delay (feedback visual)
      const nextUndone = items.find(i => i.key !== itemKey && !i.setsLog.every(s => s.done))
      if (nextUndone) setTimeout(() => setActiveKey(nextUndone.key), 350)
    }
    if (willBeDone) {
      setRestEnd(Date.now() + 50 * 1000)
      if (sidRef.current && it && s) {
        DB.saveSet(sidRef.current, user.id, athlete, it.exId, it.ex?.name || '', setN, s.kg, s.reps, null).catch(()=>{})
      }
    }
  }

  // Atualiza kg ou reps de uma série; propaga kg da série 1 pras vazias seguintes.
  const updateSet = (itemKey, setN, field, value) => {
    setItems(prev => prev.map(it => {
      if (it.key !== itemKey) return it
      const next = it.setsLog.map(s => s.n === setN ? {...s, [field]: value} : s)
      if (setN === 1 && field === 'kg' && value !== null && value !== '') {
        for (let i = 1; i < next.length; i++) {
          if (next[i].kg === null || next[i].kg === undefined || next[i].kg === '') {
            next[i] = {...next[i], kg: value}
          }
        }
      }
      return {...it, setsLog: next}
    }))
  }

  // Adiciona exercício ao vivo (não persiste no plano).
  const addLive = (ex) => {
    const defaultCfg = { sets: ex.ds, reps: ex.dr }
    const key = `live-${Date.now()}`
    setItems(prev=>[...prev, {
      exId:ex.id, ex, key, ...defaultCfg, isLive:true,
      setsLog: initSetsLog(defaultCfg.sets)
    }])
  }

  const finish = async ()=>{
    const mins = Math.round((Date.now()-startRef.current)/60000)
    await DB.finishSession(sidRef.current, doneSet.size, mins).catch(()=>{})
    clearActiveWorkout()
    setFin(true)
  }

  const pct = items.length ? (doneSet.size/items.length)*100 : 0

  if(fin) return (
    <div className="su" style={{position:'fixed',inset:0,background:'var(--black)',zIndex:400,
      display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',
      gap:24,padding:32,textAlign:'center'}}>
      <div style={{width:80,height:80,borderRadius:'var(--r-lg)',background:'var(--lime)',
        display:'flex',alignItems:'center',justifyContent:'center',fontSize:36}}>🏆</div>
      <div>
        <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:36,
          letterSpacing:'var(--track-tight)',color:'var(--off-white)',lineHeight:.95}}>
          TREINO<br/>CONCLUÍDO
        </div>
        <div style={{fontFamily:'var(--font-italic)',fontStyle:'italic',
          fontSize:16,color:'rgba(255,252,244,0.55)',marginTop:10}}>
          {doneSet.size} de {items.length} exercícios
        </div>
      </div>
      <button className="btn-primary btn-lime" style={{maxWidth:280,fontSize:13}} onClick={onClose}>
        → Voltar aos treinos
      </button>
    </div>
  )

  return (
    <div className="su" style={{position:'fixed',inset:0,background:'var(--bg)',zIndex:400,
      display:'flex',flexDirection:'column',overflow:'hidden',transition:'background .2s'}}>

      {/* ── header ── */}
      <div style={{background:'var(--black)',flexShrink:0}}>
        <div style={{padding:'14px 16px',display:'flex',alignItems:'center',gap:12}}>
          <button className="btn-icon active" onClick={onClose} style={{fontSize:14}}>✕</button>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:16,
              letterSpacing:'var(--track-tight)',color:'var(--off-white)',
              overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{plan.name}</div>
            <div style={{fontSize:12,color:'rgba(255,252,244,0.50)',fontWeight:600,marginTop:1}}>
              {doneSet.size}/{items.length} concluídos
            </div>
          </div>
          {/* progress ring */}
          <div style={{position:'relative',width:40,height:40,flexShrink:0}}>
            <svg width={40} height={40} viewBox="0 0 40 40">
              <circle cx={20} cy={20} r={16} fill="none" stroke="rgba(255,252,244,0.12)" strokeWidth={4}/>
              <circle cx={20} cy={20} r={16} fill="none" stroke="var(--lime)" strokeWidth={4}
                strokeDasharray={2*Math.PI*16}
                strokeDashoffset={2*Math.PI*16*(1-pct/100)}
                strokeLinecap="round" transform="rotate(-90 20 20)"
                style={{transition:'stroke-dashoffset .4s var(--ease)'}}/>
            </svg>
            <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center',
              fontSize:9,fontWeight:900,color:'var(--off-white)'}}>{Math.round(pct)}%</div>
          </div>
        </div>
        {/* progress bar */}
        <div style={{height:2,background:'rgba(255,252,244,0.08)'}}>
          <div style={{height:'100%',background:'var(--lime)',width:`${pct}%`,transition:'width .4s var(--ease)'}}/>
        </div>
        {/* tip */}
        <div style={{padding:'8px 16px',background:'rgba(212,255,61,0.10)',
          fontSize:12,color:'rgba(212,255,61,0.85)',fontWeight:600,display:'flex',gap:6,alignItems:'center'}}>
          <span>→</span> Preencha kg e reps de cada série, depois marque o ✓
        </div>
      </div>

      {/* ── exercise list ── */}
      <div style={{flex:1,minHeight:0,overflowY:'auto',WebkitOverflowScrolling:'touch',touchAction:'pan-y',padding:'12px 16px',display:'flex',flexDirection:'column',gap:8}}>
        {items.map((e,i)=>{
          const isDone = doneSet.has(e.key)
          const m = M[e.ex.m]
          const animC = m.bg==='#0F0F0F' ? '#FFFCF4' : m.c
          const sug = suggestions[e.exId]
          return (
            <div key={e.key} style={{
              background: isDone ? 'var(--fg)' : 'var(--bg-card)',
              borderRadius:'var(--r-lg)',
              border:`1.5px solid ${isDone?'var(--fg)': activeKey===e.key ? 'var(--lime)' : 'var(--rule)'}`,
              boxShadow: isDone ? 'none' : activeKey===e.key ? '0 0 0 3px rgba(212,255,61,0.15)' : 'var(--shadow-card)',
              transition:'all .2s var(--ease)',
            }}>
              {/* header — toque abre/fecha as séries */}
              <div
                onClick={() => !isDone && setActiveKey(activeKey === e.key ? null : e.key)}
                style={{padding:'12px 14px 8px',display:'flex',alignItems:'center',gap:12,
                  cursor: isDone ? 'default' : 'pointer', userSelect:'none',
                  WebkitTapHighlightColor:'transparent',
                }}>
                <div style={{
                  width:20,height:20,borderRadius:10,flexShrink:0,
                  display:'flex',alignItems:'center',justifyContent:'center',
                  background: isDone ? 'var(--lime)' : 'var(--bg-inset)',
                  fontSize:9,fontWeight:900,
                  color: isDone ? 'var(--bg)' : 'var(--fg-muted)',
                }}>{isDone ? '✓' : i+1}</div>
                <div style={{width:40,height:40,flexShrink:0,background:m.bg,
                  borderRadius:'var(--r-sm)',padding:4,
                  opacity:isDone?.5:1,transition:'opacity .2s'}}>
                  <ExAnim ak={e.ex.a} c={animC}/>
                </div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13,
                    color:isDone?'rgba(255,252,244,0.55)':'var(--fg)',
                    textDecoration:isDone?'line-through':'none',
                    overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:3}}>
                    {e.ex.name}
                    {e.isLive && <span style={{marginLeft:6,fontSize:10,
                      background:'var(--lime)',color:'var(--black)',
                      padding:'1px 5px',borderRadius:999,fontWeight:700}}>+</span>}
                  </div>
                  <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
                    <span style={{fontSize:11,fontWeight:900,
                      color:isDone?'rgba(255,252,244,0.35)':'var(--fg-muted)',
                      letterSpacing:'.04em',textTransform:'uppercase'}}>
                      {e.sets}×{e.reps}
                    </span>
                    <MChip mKey={e.ex.m} small/>
                    {sug && !isDone && (
                      <span style={{fontSize:11,fontStyle:'italic',
                        fontFamily:'var(--font-italic)',color:'var(--fg-muted)'}}>
                        última: {sug.weight_kg ?? '?'}kg × {sug.reps ?? '?'} reps
                      </span>
                    )}
                  </div>
                </div>
                {/* chevron */}
                {!isDone && (
                  <div style={{
                    fontSize:16, color: activeKey===e.key ? 'var(--lime)' : 'var(--fg-muted)',
                    flexShrink:0, lineHeight:1,
                    transform: activeKey===e.key ? 'rotate(180deg)' : 'rotate(0deg)',
                    transition:'transform .2s var(--ease), color .2s',
                  }}>▾</div>
                )}
              </div>
              {/* sets table — só aparece no exercício ativo (accordion) */}
              {!isDone && activeKey===e.key && (
                <div style={{padding:'4px 14px 12px',display:'flex',flexDirection:'column',gap:6}}>
                  {e.setsLog.map(s => (
                    <div key={s.n} style={{
                      display:'flex',alignItems:'center',gap:8,
                      padding:'6px 8px',
                      background: s.done ? 'rgba(212,255,61,0.18)' : 'var(--bg-card)',
                      border: `1.5px solid ${s.done ? 'rgba(212,255,61,0.35)' : 'var(--rule-strong)'}`,
                      borderRadius:'var(--r-sm)',
                      transition:'background .2s var(--ease)',
                    }}>
                      <div style={{fontSize:10,fontWeight:900,letterSpacing:'.06em',
                        textTransform:'uppercase',color:'var(--fg-muted)',width:46,flexShrink:0}}>
                        Série {s.n}
                      </div>
                      <input type="number" inputMode="decimal" step="0.5"
                        value={s.kg ?? ''}
                        onChange={ev => updateSet(e.key, s.n, 'kg', ev.target.value === '' ? null : parseFloat(ev.target.value))}
                        placeholder="kg"
                        style={{
                          flex:1,minWidth:0,padding:'8px 10px',borderRadius:'var(--r-sm)',
                          border:'1.5px solid var(--rule-strong)',background:'var(--bg-inset)',
                          fontSize:14,fontWeight:700,color:'var(--fg)',textAlign:'center',
                        }}/>
                      <span style={{fontSize:11,color:'var(--fg-muted)',fontWeight:700}}>×</span>
                      <input type="number" inputMode="numeric"
                        value={s.reps ?? ''}
                        onChange={ev => updateSet(e.key, s.n, 'reps', ev.target.value === '' ? null : parseInt(ev.target.value, 10))}
                        placeholder={String(e.reps)}
                        style={{
                          width:60,padding:'8px 10px',borderRadius:'var(--r-sm)',
                          border:'1.5px solid var(--rule-strong)',background:'var(--bg-inset)',
                          fontSize:14,fontWeight:700,color:'var(--fg)',textAlign:'center',
                        }}/>
                      <button onClick={()=>toggleSet(e.key, s.n)} style={{
                        flexShrink:0,width:40,height:40,borderRadius:'var(--r-sm)',
                        background: s.done ? 'var(--lime)' : 'var(--fg)',
                        color: s.done ? 'var(--black)' : 'var(--bg)',
                        border:'none',fontWeight:900,fontSize:16,
                        transition:'background .15s var(--ease)',cursor:'pointer',
                      }}>
                        {s.done ? '✓' : '○'}
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )
        })}

        {/* ── botão adicionar exercício (Etapa 3) ── */}
        <button onClick={()=>setAddSheet(true)} style={{
          marginTop:4,width:'100%',padding:'12px',
          border:'1.5px dashed var(--rule-strong)',borderRadius:'var(--r-lg)',
          background:'transparent',color:'var(--black-60)',
          display:'flex',alignItems:'center',justifyContent:'center',gap:8,
          fontSize:13,fontWeight:700,
          transition:'all var(--dur) var(--ease)',
        }}
          onMouseEnter={e=>{e.currentTarget.style.borderColor='var(--fg)';e.currentTarget.style.color='var(--fg)'}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor='var(--rule-strong)';e.currentTarget.style.color='var(--fg-muted)'}}>
          <span style={{fontSize:18,lineHeight:1}}>+</span> Adicionar exercício
        </button>

        <div style={{height:8}}/>
      </div>

      {/* ── rest timer ── */}
      {restEnd && (
        <div style={{padding:'10px 16px',background:'var(--lime)',
          borderTop:'1.5px solid rgba(15,15,15,0.10)',flexShrink:0,
          display:'flex',alignItems:'center',gap:10}}>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:10,fontWeight:900,letterSpacing:'.08em',
              textTransform:'uppercase',color:'rgba(15,15,15,0.55)'}}>
              Descanso
            </div>
            <div style={{fontFamily:'var(--font-display)',fontWeight:900,
              fontSize:24,color:'var(--black)',letterSpacing:'var(--track-tight)',lineHeight:1}}>
              <RestCountdown end={restEnd}/>
            </div>
          </div>
          <button onClick={()=>setRestEnd(end => Math.max(Date.now()+5000, (end||Date.now())-15000))}
            style={{padding:'6px 10px',borderRadius:'var(--r-sm)',background:'rgba(15,15,15,0.12)',
              border:'none',color:'var(--black)',fontSize:11,fontWeight:900}}>
            −15s
          </button>
          <button onClick={()=>setRestEnd(end => (end||Date.now())+15000)}
            style={{padding:'6px 10px',borderRadius:'var(--r-sm)',background:'rgba(15,15,15,0.12)',
              border:'none',color:'var(--black)',fontSize:11,fontWeight:900}}>
            +15s
          </button>
          <button onClick={()=>setRestEnd(null)}
            style={{padding:'6px 12px',borderRadius:'var(--r-sm)',background:'var(--black)',
              border:'none',color:'var(--off-white)',fontSize:11,fontWeight:900}}>
            Pular
          </button>
        </div>
      )}

      {/* ── finish bar ── */}
      {doneSet.size > 0 && (
        <div style={{padding:'12px 16px 18px',background:'var(--black)',
          borderTop:'1.5px solid rgba(255,252,244,0.08)',flexShrink:0}}>
          <button className="btn-primary btn-lime" style={{fontSize:13}} onClick={finish}>
            {doneSet.size===items.length
              ? '🏆 Finalizar treino'
              : `→ Encerrar (${doneSet.size}/${items.length})`}
          </button>
        </div>
      )}

      {/* add sheet */}
      {addSheet && (
        <AddExSheet
          onAdd={addLive}
          onClose={()=>setAddSheet(false)}
          existingIds={items.map(i=>i.exId)}
        />
      )}
    </div>
  )
}

// PLAN MODAL
// ═══════════════════════════════════════════════════════════
function PlanModal({onSave, onClose, editing}) {
  const [step,setStep]=useState(1)
  const [name,setName]=useState(editing?.name||'')
  const [sel,setSel]=useState(editing?.exercises.map(e=>e.exId)||[])
  const [cfgs,setCfgs]=useState(()=>
    editing ? Object.fromEntries(editing.exercises.map(e=>[e.exId,{sets:e.sets,reps:e.reps}])) : {}
  )
  const [mf,setMf]=useState(null)

  const toggle = id=>{
    setSel(p=>{
      if(p.includes(id)) return p.filter(x=>x!==id)
      const ex=EX.find(x=>x.id===id)
      setCfgs(c=>({...c,[id]:{sets:ex.ds,reps:ex.dr}}))
      return [...p,id]
    })
  }
  const move = (i,d)=>{
    setSel(p=>{const a=[...p],n=i+d;if(n<0||n>=a.length)return a;[a[i],a[n]]=[a[n],a[i]];return a})
  }
  const upd = (id,f,v)=>setCfgs(c=>({...c,[id]:{...(c[id]||{sets:3,reps:12}),[f]:Math.max(1,v)}}))
  const canGo = name.trim() && sel.length>0
  const fex = mf ? EX.filter(e=>e.m===mf) : EX

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(15,15,15,.65)',zIndex:300,
      display:'flex',flexDirection:'column',justifyContent:'flex-end'}}
      onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="su" style={{background:'var(--bg-card)',borderRadius:'var(--r-lg) var(--r-lg) 0 0',
        maxHeight:'94vh',display:'flex',flexDirection:'column',overflow:'hidden',

        {/* header */}
        <div style={{padding:'18px 18px 14px',borderBottom:'1.5px solid var(--rule)',flexShrink:0}}>
          {/* stepper */}
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
            {[1,2].map(n=>(

                  color:step>=n?'var(--bg)':'var(--fg-muted)'}}>
                  {step>n?'✓':n}
                </div>
                <span style={{fontSize:12,fontWeight:700,letterSpacing:'.04em',textTransform:'uppercase',
                  color:step===n?'var(--fg)':'var(--fg-muted)'}}>
                  {n===1?'Exercícios':'Séries & ordem'}
                </span>
                {n<2&&<div style={{flex:1,height:1.5,borderRadius:1,
                  background:step>1?'var(--fg)':'var(--rule)'}}/>}
              </React.Fragment>
            ))}
            <button className="btn-icon" onClick={onClose} style={{fontSize:13,marginLeft:8}}>✕</button>
          </div>
          <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:22,
            letterSpacing:'var(--track-tight)'}}>
            {editing?'Editar treino':step===1?'Novo treino':'Configurar'}
          </div>
          <div style={{fontFamily:'var(--font-italic)',fontStyle:'italic',fontSize:13,
            color:'var(--fg-muted)',marginTop:3}}>
            {step===1
              ? `${sel.length} selecionado${sel.length!==1?'s':''} — toque para adicionar`
              : 'Ajuste séries, reps e reordene com ↑↓'}
          </div>
        </div>

        {/* body */}
        <div style={{flex:1,overflowY:'auto',padding:'16px 18px'}}>
          {step===1 && <>
            <div style={{marginBottom:16}}>
              <label style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',
                color:'var(--fg-muted)',display:'block',marginBottom:8}}>Nome do treino *</label>
              <input className="input-field" value={name}
                onChange={e=>setName(e.target.value)}
                placeholder="Ex: Treino A — Pernas"/>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <label style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',
                color:'var(--fg-muted)'}}>Exercícios *</label>
              {sel.length>0&&<span className="capsule capsule-lime">{sel.length} sel.</span>}
            </div>
            <div style={{display:'flex',gap:6,marginBottom:12,overflowX:'auto',paddingBottom:4}}>
              <button className={`pill ${mf===null?'active':''}`} onClick={()=>setMf(null)}>Todos</button>
              {Object.entries(M).map(([k,v])=>(
                <button key={k} className={`pill ${mf===k?'active':''}`}
                  onClick={()=>setMf(mf===k?null:k)}>{v.l}</button>
              ))}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:7}}>
              {fex.map((ex,i)=>(
                <ExRow key={ex.id} ex={ex} compact sel={sel.includes(ex.id)}
                  onClick={()=>toggle(ex.id)} delay={i*.015}/>
              ))}
            </div>
          </>}

          {step===2 && <>
            <div style={{padding:'10px 12px',background:'rgba(212,255,61,0.12)',
              border:'1px solid rgba(212,255,61,0.3)',borderRadius:'var(--r-sm)',
              marginBottom:14,fontSize:13,color:'var(--fg)',fontWeight:600}}>

            </div>
            {sel.map((id,idx)=>{
              const ex=EX.find(x=>x.id===id), cfg=cfgs[id]||{sets:3,reps:12}
              const m=M[ex.m], animC=m.bg==='#0F0F0F'?'#FFFCF4':m.c
              return (
                <div key={id} className="card" style={{padding:'14px',marginBottom:9}}>
                  <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
                    {/* reorder */}
                    <div style={{display:'flex',flexDirection:'column',gap:3}}>
                      {[[-1,'↑'],[1,'↓']].map(([d,ic])=>{
                        const dis=d===-1?idx===0:idx===sel.length-1
                        return (
                          <button key={d} onClick={()=>move(idx,d)} disabled={dis}
                            style={{width:22,height:22,borderRadius:'var(--r-sm)',fontSize:11,fontWeight:700,
                              background:dis?'transparent':'var(--bg-inset)',
                              color:dis?'var(--rule)':'var(--fg-muted)',
                              border:`1.5px solid ${dis?'transparent':'var(--rule)'}`,
                              display:'flex',alignItems:'center',justifyContent:'center',
                              cursor:dis?'default':'pointer'}}>{ic}</button>
                        )
                      })}
                    </div>
                    {/* num badge */}
                    <div style={{width:22,height:22,borderRadius:11,background:'var(--fg)',
                      display:'flex',alignItems:'center',justifyContent:'center',
                      fontSize:10,color:'var(--bg)',fontWeight:900,flexShrink:0}}>{idx+1}</div>
                    {/* anim */}
                    <div style={{width:36,height:36,background:m.bg,borderRadius:'var(--r-sm)',padding:3,flexShrink:0}}>
                      <ExAnim ak={ex.a} c={animC}/>
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:13,
                        overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ex.name}</div>
                      <MChip mKey={ex.m} small/>
                    </div>
                    <button className="btn-icon danger" onClick={()=>setSel(p=>p.filter(x=>x!==id))}
                      style={{fontSize:12}}>✕</button>
                  </div>
                  {/* sets/reps */}
                  <div style={{display:'flex',gap:10}}>
                    {[['sets','Séries'],['reps','Reps']].map(([f,lbl])=>(
                      <div key={f} style={{flex:1,background:'var(--bg-inset)',
                        borderRadius:'var(--r-md)',padding:'10px 12px'}}>
                        <div style={{fontSize:10,fontWeight:700,letterSpacing:'.08em',
                          textTransform:'uppercase',color:'var(--fg-muted)',marginBottom:8}}>{lbl}</div>
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                          {[[(cfg[f]||1)-1,'−'],[(cfg[f]||0)+1,'+']].map(([v,ic],bi)=>(
                            <button key={bi} onClick={()=>upd(id,f,v)}
                              style={{width:32,height:32,borderRadius:'var(--r-sm)',
                                background:'var(--bg-card)',border:'1.5px solid var(--rule)',
                                color:'var(--fg)',fontSize:18,fontWeight:700,
                                display:'flex',alignItems:'center',justifyContent:'center',
                                transition:'all var(--dur) var(--ease)'}}
                              onMouseEnter={e=>{e.currentTarget.style.background='var(--fg)';e.currentTarget.style.color='var(--bg)'}}
                              onMouseLeave={e=>{e.currentTarget.style.background='var(--bg-card)';e.currentTarget.style.color='var(--fg)'}}>{ic}</button>
                          ))}
                          <span style={{fontSize:22,fontWeight:900,minWidth:28,textAlign:'center'}}>{cfg[f]||0}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )
            })}
          </>}
        </div>

        {/* footer */}
        <div style={{padding:'12px 18px 18px',borderTop:'1.5px solid var(--rule)',
          display:'flex',gap:8,flexShrink:0}}>
          {step===2 && (
            <button className="btn-ghost" style={{flex:'none',width:'auto',padding:'12px 16px',fontSize:13}}
              onClick={()=>setStep(1)}>← Voltar</button>
          )}
          <button className="btn-primary" disabled={!canGo} onClick={
            step===1 ? ()=>{if(canGo)setStep(2)} : ()=>{
              if(!name.trim()||!sel.length) return
              onSave({
                name:name.trim(), _db:editing?._db, id:editing?.id,
                exercises:sel.map(id=>({exId:id,...(cfgs[id]||{sets:3,reps:12})}))
              })
            }
          } style={{fontSize:12}}>
            {step===1
              ? (canGo ? `Próximo: ${sel.length} exercício${sel.length!==1?'s':''} →` : 'Selecione exercícios')
              : (editing ? 'Salvar alterações' : '✓ Criar treino')}
          </button>
        </div>
      </div>
    </div>
  )
}

// Início da semana atual (segunda) em horário local.
const _startOfWeek = ()=>{
  const now = new Date()
  const dayOfWeek = (now.getDay() + 6) % 7   // 0=Mon ... 6=Sun
  const monday = new Date(now)
  monday.setDate(now.getDate() - dayOfWeek)
  monday.setHours(0,0,0,0)
  return monday
}

// Bloco visual padrão de seção.
const ProgSection = ({title, subtitle, children})=>(
  <section style={{marginBottom:24}}>
    <div style={{fontSize:11,fontWeight:700,letterSpacing:'.08em',textTransform:'uppercase',
      color:'var(--fg-muted)',marginBottom:4}}>{title}</div>
    {subtitle && <div style={{fontFamily:'var(--font-italic)',fontStyle:'italic',
      fontSize:12,color:'var(--fg-muted)',marginBottom:12}}>{subtitle}</div>}
    {children}
  </section>
)

// Volume por grupo muscular na semana atual (seg-dom).
function WeekVolumeBars({sets}) {
  const monday = _startOfWeek()
  const thisWeek = sets.filter(s => new Date(s.completed_at) >= monday)
  const byMuscle = {}
  Object.keys(M).forEach(m => byMuscle[m] = 0)
  thisWeek.forEach(s => {
    const ex = EX.find(x => x.id === s.exercise_id)
    if (ex) byMuscle[ex.m] = (byMuscle[ex.m] || 0) + 1
  })
  const max = Math.max(1, ...Object.values(byMuscle))
  return (
    <ProgSection title="Volume da semana" subtitle={`${thisWeek.length} séries · semana atual`}>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {Object.entries(M).map(([k, v]) => {
          const count = byMuscle[k]
          const pct = (count / max) * 100
          return (
            <div key={k} style={{display:'flex',alignItems:'center',gap:10}}>
              <div style={{width:64,fontSize:11,fontWeight:700,color:'var(--fg)'}}>{v.l}</div>
              <div style={{flex:1,height:14,background:'var(--bg-inset)',borderRadius:7,
                overflow:'hidden',position:'relative'}}>
                <div style={{
                  width:`${pct}%`,height:'100%',
                  background:v.bg==='#0F0F0F'?'var(--fg)':v.bg,
                  transition:'width .4s var(--ease)'
                }}/>
              </div>
              <div style={{width:28,textAlign:'right',fontSize:12,fontWeight:900,color:'var(--fg)'}}>
                {count}
              </div>
            </div>
          )
        })}
      </div>
    </ProgSection>
  )
}

// Calendário de consistência: 12 semanas × 7 dias.
// Linhas = dias da semana (Seg→Dom), colunas = semanas (mais antiga à esq).
function ConsistencyCalendar({sessions}) {
  const monday = _startOfWeek()
  const start = new Date(monday)
  start.setDate(monday.getDate() - 11 * 7)   // 12 semanas atrás (incluindo a atual)

  const byDay = {}
  sessions.forEach(s => {
    if (!s.finished_at) return
    const key = new Date(s.finished_at).toISOString().slice(0,10)
    byDay[key] = (byDay[key] || 0) + 1
  })

  const weeks = []
  for (let w = 0; w < 12; w++) {
    const days = []
    for (let d = 0; d < 7; d++) {
      const date = new Date(start)
      date.setDate(start.getDate() + w*7 + d)
      const key = date.toISOString().slice(0,10)
      days.push({date, key, count: byDay[key] || 0})
    }
    weeks.push(days)
  }
  const totalDays = Object.keys(byDay).length

  return (
    <ProgSection title="Consistência" subtitle={`últimas 12 semanas · ${totalDays} dias treinados`}>
      <div style={{display:'flex',gap:3,overflowX:'auto'}}>
        {weeks.map((days, wi) => (
          <div key={wi} style={{display:'flex',flexDirection:'column',gap:3}}>
            {days.map((d) => {
              const intensity = d.count === 0 ? 0 : Math.min(1, 0.45 + d.count * 0.25)
              return (
                <div key={d.key}
                  title={`${d.date.toLocaleDateString('pt-BR')}${d.count?` · ${d.count} treino`:''}`}
                  style={{
                    width:14,height:14,borderRadius:3,
                    background: d.count === 0 ? 'var(--bg-inset)' : 'var(--lime)',
                    opacity: d.count === 0 ? 1 : intensity,
                    transition:'background .2s var(--ease)',
                  }}/>
              )
            })}
          </div>
        ))}
      </div>
    </ProgSection>
  )
}

// Top 5 exercícios por 1RM estimado (fórmula de Epley).
function TopPRsList({sets}) {
  const byEx = {}
  sets.forEach(s => {
    if (!s.weight_kg || !s.reps) return
    const oneRM = s.weight_kg * (1 + s.reps / 30)
    if (!byEx[s.exercise_id] || oneRM > byEx[s.exercise_id].oneRM) {
      byEx[s.exercise_id] = {
        exId: s.exercise_id,
        name: s.exercise_name || (EX.find(x => x.id === s.exercise_id)?.name || 'Exercício'),
        oneRM, kg: s.weight_kg, reps: s.reps
      }
    }
  })
  const top = Object.values(byEx).sort((a,b) => b.oneRM - a.oneRM).slice(0,5)
  if (top.length === 0) return null
  return (
    <ProgSection title="PRs estimados" subtitle="1RM via Epley · top 5">
      <div style={{display:'flex',flexDirection:'column',gap:6}}>
        {top.map(pr => (
          <div key={pr.exId} style={{
            display:'flex',alignItems:'center',gap:10,
            padding:'10px 12px',background:'var(--bg-card)',
            border:'1.5px solid var(--rule)',borderRadius:'var(--r-md)',
          }}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:13,color:'var(--fg)',
                overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                {pr.name}
              </div>
              <div style={{fontSize:11,color:'var(--fg-muted)',marginTop:1}}>
                base: {pr.kg}kg × {pr.reps} reps
              </div>
            </div>
            <div style={{
              fontFamily:'var(--font-display)',fontWeight:900,fontSize:18,
              color:'var(--fg)',letterSpacing:'var(--track-tight)'
            }}>
              {Math.round(pr.oneRM*10)/10}<span style={{fontSize:11,fontWeight:700,marginLeft:2}}>kg</span>
            </div>
          </div>
        ))}
      </div>
    </ProgSection>
  )
}

// Gráfico de progressão por exercício — linha SVG.
function ProgressionChart({sets}) {
  const byEx = {}
  sets.forEach(s => {
    if (!s.weight_kg) return
    const day = String(s.completed_at).slice(0,10)
    if (!byEx[s.exercise_id]) byEx[s.exercise_id] = {
      name: s.exercise_name || (EX.find(x => x.id === s.exercise_id)?.name || 'Exercício'),
      days: {}
    }
    byEx[s.exercise_id].days[day] = Math.max(byEx[s.exercise_id].days[day] || 0, s.weight_kg)
  })
  const eligible = Object.entries(byEx)
    .filter(([, e]) => Object.keys(e.days).length >= 2)
    .sort((a, b) => Object.keys(b[1].days).length - Object.keys(a[1].days).length)
  const [selected, setSelected] = useState(eligible[0]?.[0] || '')
  if (eligible.length === 0) {
    return (
      <ProgSection title="Progressão" subtitle="precisa de 2+ dias com o mesmo exercício">
        <div style={{padding:'24px 16px',textAlign:'center',
          background:'var(--bg-card)',border:'2px dashed var(--rule)',borderRadius:'var(--r-lg)',
          color:'var(--fg-muted)',fontSize:13}}>
          Treina algumas vezes pra começar a ver evolução aqui.
        </div>
      </ProgSection>
    )
  }
  const cur = byEx[selected] || byEx[eligible[0][0]]
  const points = Object.entries(cur.days)
    .sort(([a], [b]) => a.localeCompare(b))
    .map(([day, kg]) => ({day, kg}))

  // Layout SVG
  const w = 320, h = 140, pad = 24
  const kgs = points.map(p => p.kg)
  const minKg = Math.min(...kgs)
  const maxKg = Math.max(...kgs)
  const rangeKg = Math.max(0.5, maxKg - minKg)
  const xs = points.map((_, i) =>
    pad + (points.length === 1 ? (w - 2*pad)/2 : (i / (points.length - 1)) * (w - 2*pad)))
  const ys = points.map(p => h - pad - ((p.kg - minKg) / rangeKg) * (h - 2*pad))
  const path = points.map((_, i) => `${i === 0 ? 'M' : 'L'}${xs[i].toFixed(1)} ${ys[i].toFixed(1)}`).join(' ')

  return (
    <ProgSection title="Progressão" subtitle={`carga × tempo · ${points.length} dia${points.length>1?'s':''}`}>
      <select value={selected} onChange={ev => setSelected(ev.target.value)}
        style={{
          width:'100%',padding:'10px 12px',borderRadius:'var(--r-sm)',
          border:'1.5px solid var(--rule)',background:'var(--bg-card)',
          fontSize:13,fontWeight:700,color:'var(--fg)',marginBottom:10,
        }}>
        {eligible.map(([id, e]) => <option key={id} value={id}>{e.name}</option>)}
      </select>
      <div style={{padding:14,background:'var(--bg-card)',
        border:'1.5px solid var(--rule)',borderRadius:'var(--r-md)'}}>
        <svg viewBox={`0 0 ${w} ${h}`} style={{width:'100%',height:'auto',display:'block'}}>
          {/* baseline */}
          <line x1={pad} y1={h-pad} x2={w-pad} y2={h-pad} stroke="var(--rule)" strokeWidth={1}/>
          <path d={path} stroke="var(--lime)" strokeWidth={2.5} fill="none" strokeLinecap="round"/>
          {points.map((_, i) => (
            <circle key={i} cx={xs[i]} cy={ys[i]} r={3.5} fill="var(--lime)"
              stroke="var(--fg)" strokeWidth={1.2}/>
          ))}
        </svg>
        <div style={{display:'flex',justifyContent:'space-between',marginTop:6,
          fontSize:11,color:'var(--fg-muted)'}}>
          <span>{points[0].day.slice(5).split('-').reverse().join('/')} · {points[0].kg}kg</span>
          <span>{points[points.length-1].day.slice(5).split('-').reverse().join('/')} · {points[points.length-1].kg}kg</span>
        </div>
      </div>
    </ProgSection>
  )
}

function ProgressTab({uid, athlete}) {
  const [loading, setLoading] = useState(true)
  const [sets, setSets] = useState([])
  const [sessions, setSessions] = useState([])
  const [bio, setBio] = useState([])

  useEffect(()=>{
    setLoading(true)
    const since = new Date(Date.now() - 12 * 7 * 24 * 60 * 60 * 1000).toISOString()
    const promises = [DB.recentSets(uid, athlete, since), DB.recentSessions(uid, athlete, since)]
    // Bioimpedância só pra Verô (a Jornada é só dela).
    promises.push(athlete === 'veronica' ? DB.bioimpedancia(uid, 90) : Promise.resolve([]))
    Promise.all(promises)
      .then(([s, ss, b]) => { setSets(s); setSessions(ss); setBio(b) })
      .catch(e => console.warn('Progress fetch falhou', e))
      .finally(() => setLoading(false))
  },[uid, athlete])

  if (loading) return (
    <div style={{padding:'40px 16px',textAlign:'center'}}>
      <Spinner sz={28}/>
    </div>
  )

  const empty = sets.length === 0 && sessions.length === 0
  if (empty && bio.length === 0) return (
    <div style={{textAlign:'center',padding:'44px 16px',
      background:'var(--bg-card)',borderRadius:'var(--r-lg)',
      border:'2px dashed var(--rule)'}}>
      <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:17,marginBottom:6}}>
        Sem dados ainda
      </div>
      <div style={{fontFamily:'var(--font-italic)',fontStyle:'italic',
        fontSize:14,color:'var(--fg-muted)'}}>
        Treina algumas vezes registrando carga e reps — o progresso aparece aqui.
      </div>
    </div>
  )

  return (
    <div>
      {!empty && <WeekVolumeBars sets={sets}/>}
      {!empty && <ConsistencyCalendar sessions={sessions}/>}
      {bio.length > 0 && <BioCompositionChart bio={bio}/>}
      {!empty && <TopPRsList sets={sets}/>}
      {!empty && <ProgressionChart sets={sets}/>}
    </div>
  )
}

// Tier 3: composição corporal (peso, %gordura, massa muscular) ao longo de 90 dias.
function BioCompositionChart({bio}) {
  if (!bio || bio.length === 0) return null
  const last = bio[bio.length - 1]
  const first = bio[0]
  const deltaPeso = last.peso != null && first.peso != null
    ? Math.round((last.peso - first.peso) * 10) / 10
    : null
  const deltaGord = last.gordura_pct != null && first.gordura_pct != null
    ? Math.round((last.gordura_pct - first.gordura_pct) * 10) / 10
    : null

  // Linhas SVG sobrepostas: peso (lime) e %gordura (pink)
  const w = 320, h = 140, pad = 28
  const dates = bio.map(b => new Date(b.data).getTime())
  const xMin = Math.min(...dates), xMax = Math.max(...dates)
  const xRange = Math.max(1, xMax - xMin)
  const xs = bio.map(b => pad + ((new Date(b.data).getTime() - xMin) / xRange) * (w - 2*pad))
  const buildPath = (key) => {
    const ys = bio.map(b => b[key])
    const valid = ys.filter(v => v != null)
    if (valid.length < 2) return null
    const yMin = Math.min(...valid), yMax = Math.max(...valid)
    const yRange = Math.max(0.5, yMax - yMin)
    let path = ''
    let started = false
    bio.forEach((b, i) => {
      if (b[key] == null) return
      const y = h - pad - ((b[key] - yMin) / yRange) * (h - 2*pad)
      path += (started ? 'L' : 'M') + xs[i].toFixed(1) + ' ' + y.toFixed(1) + ' '
      started = true
    })
    return {path, yMin, yMax}
  }
  const pesoLine = buildPath('peso')
  const gordLine = buildPath('gordura_pct')

  return (
    <ProgSection title="Composição corporal" subtitle={`${bio.length} medições · últimos 90 dias`}>
      <div style={{display:'flex',gap:8,marginBottom:10}}>
        <div style={{flex:1,padding:'10px 12px',background:'var(--bg-card)',
          border:'1.5px solid var(--rule)',borderRadius:'var(--r-md)'}}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:'.06em',
            textTransform:'uppercase',color:'var(--fg-muted)'}}>Peso</div>
          <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:22,
            color:'var(--fg)',letterSpacing:'var(--track-tight)'}}>
            {last.peso ?? '—'}<span style={{fontSize:11,fontWeight:700,marginLeft:2}}>kg</span>
          </div>
          {deltaPeso != null && (
            <div style={{fontSize:11,fontWeight:700,
              color: deltaPeso < 0 ? 'var(--lime)' : (deltaPeso > 0 ? 'var(--pink)' : 'var(--fg-muted)')}}>
              {deltaPeso > 0 ? '+' : ''}{deltaPeso}kg em {bio.length} med.
            </div>
          )}
        </div>
        <div style={{flex:1,padding:'10px 12px',background:'var(--bg-card)',
          border:'1.5px solid var(--rule)',borderRadius:'var(--r-md)'}}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:'.06em',
            textTransform:'uppercase',color:'var(--fg-muted)'}}>Gordura</div>
          <div style={{fontFamily:'var(--font-display)',fontWeight:900,fontSize:22,
            color:'var(--fg)',letterSpacing:'var(--track-tight)'}}>
            {last.gordura_pct ?? '—'}<span style={{fontSize:11,fontWeight:700,marginLeft:2}}>%</span>
          </div>
          {deltaGord != null && (
            <div style={{fontSize:11,fontWeight:700,
              color: deltaGord < 0 ? 'var(--lime)' : (deltaGord > 0 ? 'var(--pink)' : 'var(--fg-muted)')}}>
              {deltaGord > 0 ? '+' : ''}{deltaGord}pp em {bio.length} med.
            </div>
          )}
        </div>
      </div>
      <div style={{padding:14,background:'var(--bg-card)',
        border:'1.5px solid var(--rule)',borderRadius:'var(--r-md)'}}>
        <svg viewBox={`0 0 ${w} ${h}`} style={{width:'100%',height:'auto',display:'block'}}>
          <line x1={pad} y1={h-pad} x2={w-pad} y2={h-pad} stroke="var(--rule)" strokeWidth={1}/>
          {pesoLine && <path d={pesoLine.path.trim()} stroke="var(--lime)" strokeWidth={2.5} fill="none" strokeLinecap="round"/>}
          {gordLine && <path d={gordLine.path.trim()} stroke="var(--pink)" strokeWidth={2.5} fill="none" strokeLinecap="round"/>}
        </svg>
        <div style={{display:'flex',gap:14,justifyContent:'center',marginTop:4,
          fontSize:11,color:'var(--fg-muted)'}}>
          <span><span style={{display:'inline-block',width:10,height:10,background:'var(--lime)',
            borderRadius:5,marginRight:4,verticalAlign:'middle'}}/>peso (kg)</span>
          <span><span style={{display:'inline-block',width:10,height:10,background:'var(--pink)',
            borderRadius:5,marginRight:4,verticalAlign:'middle'}}/>gordura (%)</span>
        </div>
      </div>
    </ProgSection>
  )
}
